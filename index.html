@media (max-width:599px){.tt-label{display:none}.theme{padding:0 .35rem}}
/* the joke: the knob heads for light, strains, wobbles, and is shoved back to dark */
.theme.is-resisting .tt-knob{transition:none;animation:tt-resist 1.3s ease-in-out both}
.theme.is-resisting .tt-track{animation:tt-shake 1.3s ease-in-out both}
@keyframes tt-resist{
  0%{transform:translateX(1.2rem);background:var(--fg)}
  34%{transform:translateX(.5rem);background:color-mix(in srgb,var(--fg) 55%,var(--tt-sun))}
  44%{transform:translateX(.58rem)}
  54%{transform:translateX(.5rem);background:color-mix(in srgb,var(--fg) 55%,var(--tt-sun))}
  80%{transform:translateX(1.27rem);background:var(--fg)}
  100%{transform:translateX(1.2rem);background:var(--fg)}
}
@keyframes tt-shake{0%,30%,62%,100%{transform:none}40%{transform:translateX(-1px)}50%{transform:translateX(1px)}}
/* during the joke the page lightens only slightly, in step with the knob, then settles back */
.theme-peek{position:fixed;inset:0;z-index:94;pointer-events:none;background:var(--peek);opacity:0;animation:tt-peek 1.3s ease-in-out both}
@keyframes tt-peek{0%{opacity:0}38%{opacity:.06}55%{opacity:.06}82%,100%{opacity:0}}
html.theme-fade,html.theme-fade *{transition:background-color .7s ease,color .7s ease,border-color .7s ease!important}
/* the joke grows out of the switch itself (reason: it is the switch answering you, not a popup) */
.theme-joke{position:fixed;top:calc(var(--bar) + 8px);right:var(--jr,var(--gut));transform-origin:var(--jo,100% 0);z-index:96;width:min(92vw,30rem);padding:1.25rem 1.4rem 1.3rem;background:var(--card-bg);color:var(--card-ink);border:1px solid var(--accent);border-radius:16px;box-shadow:0 30px 60px -20px var(--shadow);animation:joke-in .42s cubic-bezier(.2,1.3,.4,1) both;--fg:var(--card-ink);--focus:var(--accent)}
.theme-joke.is-leaving{animation:joke-out .2s ease-in both}
.theme-joke p{margin:0 0 .6rem}
.theme-joke .theme-joke-title{font-size:1.2rem;font-weight:750;letter-spacing:-.01em}
.theme-joke-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.theme-joke .cta{padding:.7rem 1.1rem;font-size:.95rem}
@keyframes joke-in{from{opacity:0;transform:scale(.15)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes joke-out{to{opacity:0;transform:scale(.2)}}
/* (formerly only with OS reduced motion; now the mode classes decide) */html:not(.mo-on) .tt-knob{transition:none}html:not(.mo-on) .theme-joke,html:not(.mo-on) .theme-joke.is-leaving{animation:none}
.cwrap{position:relative}
/* Contact is the loud pill: the sunset gradient, small */
.pill{display:inline-flex;align-items:center;gap:.5rem;border:0;cursor:pointer;background:var(--btn);color:var(--btn-fg);font:600 .92rem/1 var(--sans);padding:.72rem 1.1rem;border-radius:999px;text-decoration:none}
.pop{position:absolute;right:0;top:calc(100% + 14px);transform-origin:calc(100% - 40px) -14px;min-width:240px;border:1px solid var(--rule);border-radius:16px;padding:1rem 1.1rem 1.05rem;box-shadow:0 24px 50px -20px var(--shadow)}
.pop .lbl{margin:0 0 .5rem}
.pop ul{list-style:none;margin:0 0 .8rem;padding:0}
.pop li a{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--rule);font-weight:600;font-size:1.05rem;text-decoration:none}
.pop .plain{font:600 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase}

.ctr-box{border:1px solid var(--rule);box-shadow:0 10px 24px -16px var(--shadow);border-radius:12px;padding:.5rem .55rem .25rem .7rem}
.ctr{margin:0;display:flex;align-items:baseline;gap:.35rem;font:600 .75rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.ctr b{font:700 1rem/1 var(--sans);letter-spacing:0;min-width:2.4ch}
.dots{list-style:none;margin:.2rem 0 0;padding:0;display:flex}
.dots a{display:block;width:18px;height:22px;position:relative}
.dots a::before{content:"";position:absolute;left:5px;top:7px;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.dots a:hover::before{background:currentColor}
.dots a[aria-current="step"]::before{background:var(--link);border-color:var(--link);transform:scale(1.3)}
.cue{display:flex;align-items:center;gap:.6rem;border:1px solid var(--rule);border-radius:999px;padding:.55rem .9rem;cursor:pointer;font:600 .75rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.cue .up{display:none}
.cue.top .up{display:block}
.cue.top .dn{display:none}

/* tour progress bar: reason: shows how far through the tour you are */
.tourbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
.tourbar i{display:block;height:100%;background:var(--btn);transform-origin:0 50%;transform:scaleX(0)}
.tour-on .tourbar{opacity:1}
/* the tour bar rises from the bottom edge (JS slides it in); the corner widgets step aside meanwhile */
body.tour-on .c-bl,body.tour-on .c-br{opacity:0;visibility:hidden}
.tourbox{position:fixed;bottom:var(--corner);left:50%;z-index:80;transform:translateX(-50%);display:flex;align-items:center;gap:.5rem;border:1px solid var(--rule);border-radius:999px;padding:.35rem .35rem .35rem 1rem;font-size:.95rem;box-shadow:0 18px 40px -18px var(--shadow)}
.tourbox[hidden]{display:none}
.tourbox .hint{font-size:.875rem}
.tourbox button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:.55rem .85rem;cursor:pointer;font-weight:600;font-size:.875rem}
.tourbox button.go{background:var(--btn);border-color:transparent;color:var(--btn-fg)}

/* arrows nudge forward on hover: reason: the arrow points where the link takes you */
.go-ico{transition:transform .25s var(--ease)}
a:hover>.go-ico,a:focus-visible>.go-ico,button:hover>.go-ico,a:hover .card-ar,a:focus-visible .card-ar{transform:translateX(3px)}

/* primary button: the small sunset accent */
.cta{display:inline-flex;align-items:center;gap:.6rem;background:var(--btn);color:var(--btn-fg);text-decoration:none;border:0;cursor:pointer;border-radius:999px;padding:.9rem 1.25rem;font-weight:600;font-size:1rem}
.ghost{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--rule);border-radius:999px;padding:.7rem 1rem;font-weight:600;font-size:.95rem;text-decoration:none;background:transparent;cursor:pointer}
/* press feedback (reason: every click visibly answers before the travel it starts) */
.cta,.ghost,.pill,.btn-tour,.rbtn,.cue,.theme,.tourbox button,.s4-card-go,.d-nav a,.br-a{transition:scale 90ms ease}
.cta:active,.ghost:active,.pill:active,.btn-tour:active,.rbtn:active,.cue:active,.theme:active,.bchip:active,.tourbox button:active,.s4-card-go:active,.d-nav a:active,.br-a:active{scale:.97}

/* ---------- title page ---------- */
.hero{position:relative;padding:calc(var(--bar) + var(--sat,0px) + clamp(24px,5vh,56px)) var(--gut) clamp(56px,9vh,96px)}
.h-body{max-width:var(--max);margin:0 auto}
.tp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,72px);align-items:center}
.tp-cap{margin:0 0 .9rem}
/* the name as the big wordmark, on one line (keeps the first screen's height): the caps are 2/3 of the serif's size
   with the same .14em spacing, as in the bar (1.35rem : .9rem) */
.tp-name{margin:0 0 .6rem;font-size:clamp(2.9rem,7vw,5.8rem);line-height:1.02;letter-spacing:0;overflow-wrap:anywhere}
.tn-1{font:italic 400 1em/1 var(--serif)}
.tn-2{font:800 .667em/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-left:.06em}
.tp-name:focus{outline:none}
.tp-id{display:flex;flex-wrap:wrap;gap:.3rem 1.4rem;margin:0 0 clamp(1rem,2.6vh,1.5rem);font-size:1.0625rem;font-weight:500}
.tp-st{margin:0 0 clamp(1rem,2.6vh,1.4rem);max-width:60ch;font:400 clamp(1.3rem,1.6vw,1.5rem)/1.45 var(--serif)}
.tp-st em{font-style:italic}
/* the one underline: the phrase I most want remembered; static */
.tp-st .ul{background-image:var(--underline-gradient);background-repeat:no-repeat;background-size:100% 2px;background-position:0 100%;padding-bottom:.08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tp-links{display:flex;flex-wrap:wrap;gap:.6rem}
.tp-plate{display:block;text-decoration:none;color:inherit}
/* the cover plate is the only tilted image: reason: it is the cover illustration */
.tp-plate .fig{--rot:-1.4deg}
.tp-plate:hover .fig,.tp-plate:focus-visible .fig{box-shadow:0 40px 70px -34px var(--shadow),0 0 0 2px var(--link)}
.h-act{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem;margin-top:clamp(1.2rem,3.5vh,2rem);padding-top:clamp(1rem,2.6vh,1.4rem);border-top:1px solid var(--rule)}
.btn-tour{display:inline-flex;align-items:center;gap:.7rem;border:0;cursor:pointer;background:var(--btn);color:var(--btn-fg);border-radius:999px;padding:.85rem 1.25rem .85rem .9rem;font-weight:600;font-size:.98rem}
.btn-tour .play{width:26px;height:26px;border-radius:50%;background:var(--btn-fg);display:grid;place-items:center}
.btn-tour .play svg{width:10px;height:10px;fill:var(--sun-1)}
.btn-tour small{font:600 .75rem var(--mono);letter-spacing:.04em}
.h-act .plainlink{font-weight:600;font-size:.95rem}

/* card rail */
.rail-wrap{max-width:calc(var(--max) + 2 * var(--gut));margin:clamp(28px,6vh,56px) calc(-1 * var(--gut)) 0}
@media (min-width:1449px){.rail-wrap{margin-inline:auto;max-width:none}}
.rail-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1.5rem;padding:0 var(--gut) .8rem;max-width:calc(var(--max) + 2 * var(--gut));margin:0 auto}
.rail-head .lbl:first-child{color:var(--fg)}
.rail-ctl{display:flex;align-items:center;gap:.5rem}
.rbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:transparent;display:grid;place-items:center;cursor:pointer;font-size:1.05rem}
.rbtn:disabled{opacity:.4;cursor:default}
.rail-frame{position:relative}
/* edge fades: reason: tell you there are more cards beyond the edge */
.rail-frame::before,.rail-frame::after{content:"";position:absolute;top:0;bottom:0;width:calc(var(--gut) + 28px);z-index:2;pointer-events:none;transition:opacity .25s}
.rail-frame::before{left:0;background:linear-gradient(90deg,var(--solid),transparent)}
.rail-frame::after{right:0;background:linear-gradient(270deg,var(--solid),transparent)}
.rail-frame.at-start::before,.rail-frame.at-end::after{opacity:0}
.rail-vp{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scroll-padding-inline:var(--gut);overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab}
.rail-vp::-webkit-scrollbar{display:none}
.rail-vp.drag{scroll-snap-type:none;cursor:grabbing;-webkit-user-select:none;user-select:none}
.rail{display:flex;gap:clamp(12px,1.4vw,20px);list-style:none;margin:0;padding:.3rem var(--gut) 1rem;width:max-content}
.rail li{flex:none;width:clamp(300px,24vw,340px);scroll-snap-align:start}
.card{display:flex;flex-direction:column;height:100%;text-decoration:none;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.card:hover,.card:focus-visible{border-color:currentColor}
.card:focus-visible{outline-offset:2px}
/* cards lift a little and their picture leans in (reason: it is a physical strip of cards) */
.rail li{will-change:auto}
.card{transition:transform .25s var(--ease-out),border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px)}
.card-p img{transition:transform .4s var(--ease-out)}
.card-p svg.dg{transition:transform .4s var(--ease-out)}
.card:hover .card-p img,.card:focus-visible .card-p img,.card:hover .card-p svg.dg,.card:focus-visible .card-p svg.dg{transform:scale(1.03)}
.card-p{display:block;aspect-ratio:16/10}
.card-p.frame,.card-p.frame.cover,.card-p.frame.contain{border:0;border-radius:0;border-bottom:1px solid var(--rule)}
.card-p.frame.cutout{border:0;padding:.8rem 1rem .2rem}
.card-p img{-webkit-user-drag:none}
.card-b{display:flex;flex-direction:column;gap:.4rem;padding:.85rem 1rem 1rem;flex:1}
.card-top{display:flex;justify-content:space-between;gap:.5rem}
.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--link);margin-right:.45em;vertical-align:.04em}
.card-t{font-weight:700;font-size:1.35rem;line-height:1.2}
.card-l{font-weight:500;font-size:1rem;line-height:1.45}
.card-ar{margin-top:auto;align-self:flex-end;display:flex;align-items:center;gap:.4rem;font-size:.95rem;font-weight:600;transition:transform .25s var(--ease)}
.card:hover .card-ar,.card:focus-visible .card-ar{color:var(--link)}
/* rail progress: reason: shows how far along the strip you are; follows your drag directly */
.rail-prog{height:2px;background:var(--rule);margin:0 var(--gut);max-width:var(--max)}
@media (min-width:1449px){.rail-prog{margin:0 auto}}
.rail-prog i{display:block;height:100%;background:var(--link);transform-origin:0 50%;transform:scaleX(.2)}

/* ---------- the map (neutral; the hairlines and glow mark it as its own part) ---------- */
.map{position:relative;padding:clamp(80px,12vh,140px) var(--gut) clamp(48px,7vh,72px)}
.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem 2.5rem;margin-bottom:clamp(1.2rem,3vh,2rem)}
.map-t{margin:.3rem 0 .4rem;font-weight:700;font-size:clamp(1.9rem,3.2vw,2.9rem);line-height:1.15}
.map-sub{margin:0;max-width:52ch;font:400 1.3rem/1.4 var(--serif)}
.map-how{margin:0;max-width:34ch;font-size:1rem}
.map-count{margin:.6rem 0 0}
.map-drag{display:flex;align-items:center;gap:.45rem;margin:.7rem 0 0;font:500 .85rem/1.4 var(--sans)}
.map-drag .ico{width:1.1em;height:1.1em}
/* the connector from the selected marker to its panel (drawn by JS) */
.mconn{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:7}
.mconn path{fill:none;stroke:var(--link);stroke-width:1.5}
.mconn circle{fill:var(--link)}
/* the map and its panel side by side (panel top-right, level with the map) from about 560px up; the hint, legend and
   security note sit below both. On phones the panel comes straight under the map. */
.map-grid{--stage-h:clamp(480px,66vh,620px);position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,370px);gap:clamp(16px,2.5vw,36px);align-items:start}
.mp-pick,.mp-chips{display:none}
.mp-pick{margin:0 0 .8rem}
/* keep the panel label clear of its close button */
.mp-in>p.lbl:not(.mp-h){padding-right:40px}
.mp-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.mp-chips button{display:inline-flex;align-items:center;gap:.35rem;min-height:36px;padding:.3rem .7rem;border:1px solid var(--rule);border-radius:999px;background:transparent;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;text-align:left}
.mp-chips button:hover{border-color:var(--link)}
.stage{position:relative;height:var(--stage-h);border:1px solid var(--rule);border-radius:16px;overflow:hidden;background-image:radial-gradient(circle,var(--rule) 1px,transparent 1.3px);background-size:28px 28px}
/* calm the map: a veil in the (engine-blended) screen base, clear at the box's edges and about 87% in the middle,
   so the contour lines run into the edges and fade to ~13% behind the markers; it softens the dotted grid too */
.stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:color-mix(in srgb,var(--ce-1) 87%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--base-ink) 60px,var(--base-ink) calc(100% - 60px),transparent),linear-gradient(180deg,transparent,var(--base-ink) 60px,var(--base-ink) calc(100% - 60px),transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,var(--base-ink) 60px,var(--base-ink) calc(100% - 60px),transparent),linear-gradient(180deg,transparent,var(--base-ink) 60px,var(--base-ink) calc(100% - 60px),transparent);
  mask-composite:intersect}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* route highlight: hover state, shows which routes belong to the marker */
.edge{fill:none;stroke:currentColor;stroke-width:1.3;opacity:.45;transition:opacity .2s,stroke-width .2s}
.edge.on{stroke:var(--link);stroke:var(--route) var(--link);stroke-width:2.8;opacity:1}
.edge.dim{opacity:.18}
/* map layers, back to front: veil and grid (0), unselected routes (1), unselected markers (2), highlighted routes (3),
   connected markers (4), reason boxes (5), the selected, hovered or dragged marker (6), the connector to the panel (7) */
.edges{z-index:1}
.edges-on{z-index:3}
.node.near{z-index:4}
.node.on,.node.sel,.node.dragging{z-index:6}
.node.covered .nl{opacity:.25;transition:opacity .2s}
.node{position:absolute;left:0;top:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.35rem;background:none;border:0;padding:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform}
.node.dragging{cursor:grabbing}
.node:focus-visible{outline-offset:4px}
.mk{position:relative;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;background:var(--solid);display:grid;place-items:center;font:600 .75rem/1 var(--mono)}
.mk::before{content:"";position:absolute;inset:-7px;background:linear-gradient(currentColor,currentColor) 50% 0/1.5px 5px no-repeat,linear-gradient(currentColor,currentColor) 50% 100%/1.5px 5px no-repeat,linear-gradient(currentColor,currentColor) 0 50%/5px 1.5px no-repeat,linear-gradient(currentColor,currentColor) 100% 50%/5px 1.5px no-repeat}
.node.hub .mk{width:48px;height:48px;font-size:.85rem;box-shadow:0 0 0 5px var(--solid),0 0 0 6.5px currentColor}
.nl{max-width:10rem;text-align:center;font-weight:650;font-size:.875rem;line-height:1.25;padding:.1rem .4rem;border-radius:4px;border:1px solid var(--rule)}
.node.hub .nl{font-size:.95rem}
.node.on .mk,.node.sel .mk{background:var(--link);border-color:var(--link);color:var(--link-ink)}
.node.dim{opacity:.6}
.node.visited .mk::after{content:"";position:absolute;right:-4px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--fg);border:2px solid var(--solid)}
/* reason boxes appear on hover: they explain the highlighted route */
.elabel{position:absolute;left:0;top:0;z-index:5;max-width:13rem;font-size:.875rem;font-weight:500;line-height:1.4;border:1px solid var(--link);border-radius:8px;padding:.3rem .5rem;opacity:0;pointer-events:none;transition:opacity .2s}
.elabel.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin:.8rem 0 0}
.legend i{display:inline-block;vertical-align:-.15em;margin-right:.45em}
.lg-hub{width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor;box-shadow:0 0 0 2px var(--solid),0 0 0 3px currentColor}
.lg-v{width:10px;height:10px;border-radius:50%;background:var(--fg)}
.lg-r{width:22px;height:3px;background:var(--underline-gradient);vertical-align:.2em!important}
.secnote{margin:1rem 0 0;max-width:62ch;font-size:1rem;font-weight:500;line-height:1.55;border:1px solid var(--rule);border-left:3px solid var(--link);border-radius:8px;padding:.7rem .9rem}
.secnote b{font-weight:700}
.mp-x{position:absolute;top:6px;right:6px;z-index:2;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--card);color:var(--fg);font-size:1.7rem;line-height:1;cursor:pointer}
.mpanel{position:relative;border:1px solid var(--rule);border-radius:16px;padding:clamp(1rem,1.6vw,1.35rem);min-width:0;box-shadow:0 18px 40px -28px var(--shadow)}
.mp-fig{margin:0 0 1rem}
.mp-fig.cover{aspect-ratio:4/3}
.mp-fig.contain{aspect-ratio:16/9}
.mp-fig.cutout{aspect-ratio:3/2}
.mp-t{margin:.25rem 0 .4rem;font-weight:700;font-size:clamp(1.35rem,1.9vw,1.7rem);line-height:1.2}
.mp-line{margin:0 0 .9rem;font-weight:500;font-size:1.0625rem;line-height:1.5}
.mp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:.6rem 1rem;margin:0 0 1rem;padding:.75rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mp-facts div{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:.2rem;margin:0}
.mp-facts dd{margin:0;font-weight:700;font-size:1.05rem;line-height:1.2}
.mp-facts dt{font:600 .75rem/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.mp-h{margin:0}
.mp-conns{list-style:none;margin:.4rem 0 1rem;padding:0}
.mp-conns li{padding:.55rem 0;border-top:1px solid var(--rule)}
.mp-conns button{background:none;border:0;padding:0;cursor:pointer;font-weight:650;font-size:1.0625rem;text-align:left;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.22em}
.mp-conns button:hover{text-decoration-color:var(--link)}
.mp-conns button .lbl{margin-right:.4rem}
.mp-why{display:block;font-size:1rem;line-height:1.5;margin-top:.15rem}
.mp-act{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* ---------- chapters: an opener and a hairline mark the change of topic ---------- */
.ch-open{padding:clamp(96px,14vh,160px) var(--gut) 0}
.ch-open .in-wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem 3rem}
.ch-t{margin:.35rem 0 0;font-weight:700;font-size:clamp(2.2rem,4.4vw,3.8rem);line-height:1.05;letter-spacing:-.015em}
.ch-idx{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.35rem 1.3rem}
.ch-idx a{font-weight:600;font-size:1rem;text-decoration:none}
.ch-idx a:hover span{text-decoration:underline;text-underline-offset:.22em}
.ch-idx b{font:600 .75rem var(--mono);margin-right:.4em}

/* ---------- stops (light: the detail page holds the depth); a hairline and the number separate them ---------- */
.stop{position:relative;padding:clamp(80px,10vh,100px) var(--gut)}
/* the divider between projects: a content-width hairline with the number just under it.
   reason: the lines are the page's structure, and they are what stretches apart when a project expands. */
.s-rule{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1.2rem;max-width:var(--max);margin:0 auto clamp(14px,2.5vh,28px);padding-top:16px}
/* the divider: about 2px, confident ink, tapered ends; the page's contour lines fade in a soft band around it
   (the band is a base-coloured veil under the line, so it travels with it) */
.s-div{--ln-c:color-mix(in srgb,var(--fg) 62%,transparent);position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--ln-c) 8%,var(--ln-c) 92%,transparent);transform-origin:0 50%;transition:transform .6s var(--ease-out)}
.s-div::before{content:"";position:absolute;left:-6%;right:-6%;top:-36px;bottom:-36px;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--base-bg) 74%,transparent) 42%,color-mix(in srgb,var(--base-bg) 74%,transparent) 58%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--base-ink) 12%,var(--base-ink) 88%,transparent);mask-image:linear-gradient(90deg,transparent,var(--base-ink) 12%,var(--base-ink) 88%,transparent)}
@media (max-width:767px){.s-div{height:1.5px}}
/* divider draws itself from the left when it first enters (armed only by JS, only while off screen) */
.s-div.dv-arm{transform:scaleX(0)}
.s-end{position:relative;max-width:var(--max);height:1px;margin:clamp(56px,8vh,80px) auto 0}
.s-num{display:inline-block}
/* the stop number, large and quiet: a waymarker, not a page edge */
.s-num{font:800 clamp(3.4rem,7vw,6.2rem)/.85 var(--sans);letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1.25px currentColor;font-variant-numeric:tabular-nums;margin-right:.2rem}
.sgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(20px,3vw,56px);max-width:var(--max);margin:0 auto;align-items:center}
.s-text{grid-column:1/span 7;grid-row:1;position:relative;min-width:0}
.s-media{grid-column:8/span 5;grid-row:1;min-width:0}
/* sides alternate: reason: tells one stop from the next at a glance, without colour */
.sgrid.rev .s-text{grid-column:6/span 7}
.sgrid.rev .s-media{grid-column:1/span 5}
.s-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem 1.3rem;margin:0 0 .7rem}
.seemap{font:600 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);text-underline-offset:.25em}
.s-title{margin:0 0 .5rem;font-weight:700;font-size:clamp(1.8rem,3.2vw,2.9rem);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.s-title:focus,.d-t:focus{outline:none}
.s-line{margin:0 0 1rem;max-width:34ch;font:400 clamp(1.3rem,1.9vw,1.75rem)/1.25 var(--serif);font-style:italic}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1.1rem 2rem;margin:clamp(1.2rem,3vh,1.8rem) 0 0;padding-top:1rem;border-top:1px solid var(--rule)}
.fact{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:.4rem;margin:0}
.fact dt{font:600 .75rem/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.fact dd{margin:0;font-weight:700;font-size:clamp(1.45rem,2.3vw,2.1rem);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.s-leads{margin:1.1rem 0 0;font-size:1rem;line-height:1.5}
.s-leads .lbl{margin-right:.5rem}
.s-leads a{font-weight:600;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.22em}
.s-leads a:hover{text-decoration-color:currentColor}
.s-foot{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 2rem;margin-top:clamp(1.2rem,3vh,1.6rem)}
/* image plates sit square */
.fig{--rot:0deg;margin:0;box-shadow:0 30px 60px -36px var(--shadow),0 10px 24px -16px var(--shadow-soft);transform:rotate(var(--rot))}
.fig.cover{aspect-ratio:4/3;max-height:62vh}
.fig.contain{aspect-ratio:16/9}
.fig.cutout{aspect-ratio:3/2;max-height:62vh;box-shadow:none}
.fig-cap{display:flex;justify-content:space-between;gap:1rem;margin:1rem .2rem 0}

/* ---------- back matter ---------- */
.back{position:relative;padding:clamp(120px,16vh,180px) var(--gut) clamp(32px,5vh,56px)}
.b-head{margin-bottom:clamp(1.6rem,4vh,2.6rem)}
.b-t{margin:.3rem 0 .6rem;font-weight:700;font-size:clamp(1.9rem,3.2vw,2.9rem);line-height:1.15}
.b-t em,.end-t em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.1em}
.b-intro{margin:0;max-width:60ch;font:400 1.3rem/1.4 var(--serif)}
.b-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,80px);align-items:start}
.b-h{margin:0 0 .8rem;padding-bottom:.6rem;border-bottom:1px solid var(--rule);font-weight:700;font-size:1.15rem}
.b-block{margin-bottom:clamp(1.8rem,4vh,2.6rem)}
.entry{padding:.95rem 0 1.05rem;border-bottom:1px solid var(--rule)}
.entry h4{margin:0 0 .2rem;font-weight:700;font-size:1.1rem;line-height:1.35}
.entry .lbl{margin:0 0 .45rem}
.entry p{margin:0;max-width:62ch;font-size:1.0625rem;line-height:1.6}
.skills{margin:0}
.skills div{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr);gap:.4rem 1rem;padding:.8rem 0;border-bottom:1px solid var(--rule)}
.skills dt{font:600 .75rem/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.skills dd{margin:0;font-size:1.0625rem;line-height:1.55}
.ai{position:relative;padding:clamp(32px,6vh,64px) var(--gut) clamp(48px,8vh,88px)}
.ai-box{max-width:var(--max);margin:0 auto;border-top:1px solid var(--rule);padding-top:clamp(1.4rem,3.5vh,2.2rem);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,5vw,80px)}
.ai-t{margin:.3rem 0 0;font-weight:700;font-size:clamp(1.5rem,2.4vw,2.1rem);line-height:1.2}
.ai-p p{margin:0 0 1rem;max-width:64ch;font-size:1.0625rem;line-height:1.65}

/* ---------- ending ---------- */
.end{position:relative;padding:clamp(48px,8vh,96px) var(--gut) clamp(96px,12vh,130px)}
.end-t{margin:.4rem 0 clamp(1.2rem,4vh,2.2rem);font-weight:700;font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.05}
.end-links{list-style:none;margin:0 0 clamp(1.6rem,4vh,2.6rem);padding:0;display:flex;flex-wrap:wrap;gap:.6rem clamp(1.5rem,4vw,3.5rem)}
.end-links a{display:inline-flex;align-items:center;gap:.35em;font-weight:650;font-size:clamp(1.5rem,2.8vw,2.2rem);line-height:1.2;text-decoration:underline;text-decoration-color:var(--link);text-decoration-thickness:2px;text-underline-offset:.2em}
.end-now{margin:0 0 clamp(1.6rem,4vh,2.4rem)}
.end-now .v{display:block;margin-top:.3rem;font:400 clamp(1.25rem,1.8vw,1.5rem)/1.3 var(--serif);color:var(--fg);text-transform:none;letter-spacing:0}
.end-idx{list-style:none;margin:0 0 2rem;padding:0;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem}
.end-idx a{font-size:1rem;text-decoration:none}
.end-idx a b{font:600 .75rem var(--mono);margin-right:.4em}
.end-idx a:hover span{text-decoration:underline}
.foot{border-top:1px solid var(--rule);padding-top:1.2rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem 2rem}
.foot p{margin:0 0 .3rem;font-size:1rem}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem 1.3rem;align-items:center}
.foot ul a{font-weight:600;font-size:.95rem;text-underline-offset:.22em}
.mo-ctl{padding:0;border:0;background:none;color:inherit;cursor:pointer;font-weight:600;font-size:.95rem;text-decoration:underline;text-underline-offset:.22em}

/* =====================================================================
   EXPANDED PROJECTS: the same page, with the gap between two divider lines widened to the screen.
   The area between the lines (just under the unchanged top bar, down to the bottom edge) scrolls on
   its own; it has no background: the whole-screen colour layer behind it turns to the sunset.
   ===================================================================== */
.dlayer{position:fixed;left:0;right:0;top:calc(var(--bar) + var(--sat) + var(--ln-gap));bottom:var(--ln-gap);z-index:45;overflow:hidden;--card:var(--detail-card-bg);--card-fg:var(--detail-card-ink);--card-rule:var(--detail-card-line);--card-link:var(--detail-link);--fg:var(--detail-ink);--muted:var(--detail-ink);--rule:var(--detail-line);--hover:var(--detail-line);--link:var(--detail-onbg);--link-ink:var(--detail-btn-ink);--focus:var(--detail-onbg);--btn:var(--detail-btn-bg);--btn-fg:var(--detail-btn-ink);--solid:var(--detail-solid);--plate-c:var(--detail-plate-bg);--plate-l:var(--detail-plate-line);color:var(--fg)}
.dlayer[hidden]{display:none}
/* per-project colours: the colour engine writes blended --p-* (open project) and --m-* (main page diagram plate) values
   on :root from project-colors.js; these rules bind every colour-carrying token to them (only once html.pc-on is set,
   so without the data file the token blocks apply). See the mapping table in the script. */
html.pc-on .dlayer{--detail-ink:var(--p-ink);--detail-line:var(--p-line);--detail-onbg:var(--p-onbg);--detail-link:var(--p-accent);--detail-route-1:var(--p-accent);--detail-route-2:var(--p-accent);
  --detail-sheet-btn:var(--p-btn);--detail-sheet-btn-ink:var(--p-btn-ink);--detail-btn-bg:var(--p-btn);--detail-btn-ink:var(--p-btn-ink);
  --card-glow:var(--p-glow);--card-glow-2:transparent;--card-line-warm:var(--p-glow);--card-shadow:0 18px 44px -26px var(--p-glow);
  --c-mat:transparent;--lbox-bg:color-mix(in srgb,var(--base-bg) 94%,transparent);--svg-bg:color-mix(in srgb,var(--base-bg) 85%,transparent);--svg-ink:var(--p-plate-ink);--svg-ink-soft:var(--p-plate-ink);
  --svg-surface:var(--p-plate-fill);--svg-line:var(--p-plate-fill);--svg-accent:var(--p-plate-hl);--svg-accent-soft:var(--p-plate-fill)}
/* diagram plates follow too, once diagrams are drawn inline (a baked cream image needs its dark plate) */
/* plates are bare now: the drawing sits on the page base in a spotlight of the accent (see .frame.contain::before).
   --plate (faces that hide lines behind them) is the base, nearly opaque; fills are a faint glass on black or a faint
   accent tint on white; --plate-on is text on the one solid ink box in the old diagrams */
html.pc-on.dg-ok .dlayer{--plate:color-mix(in srgb,var(--base-bg) 85%,transparent);--plate-bg:transparent;--detail-plate-bg:transparent;--plate-on:var(--base-bg);
  --plate-ink:var(--p-plate-ink);--plate-highlight:var(--p-plate-hl);--plate-fill:var(--plate-glass,color-mix(in srgb,var(--p-plate-hl) 9%,transparent));--svg-surface:var(--plate-fill);--svg-line:var(--plate-fill);--svg-accent-soft:var(--plate-fill)}
html.pc-on.dg-ok body{--plate:color-mix(in srgb,var(--base-bg) 85%,transparent);--plate-bg:transparent;--plate-on:var(--base-bg);
  --plate-ink:var(--m-plate-ink);--plate-highlight:var(--m-plate-hl);--plate-fill:var(--plate-glass,color-mix(in srgb,var(--m-plate-hl) 9%,transparent))}
/* the spotlight: one soft light in the accent from the top-left corner and a faint fill from the bottom-right, feathered
   at the edges so no rectangle shows; drawings and diagrams sit in it with no box, border or shadow */
html.dg-ok :is(.frame.contain,.k-diagram .c-mat,.c-svgbox,.lbox-svg){position:relative;isolation:isolate;border-color:transparent;box-shadow:none;background:var(--img-veil)}
/* the veil: a soft base-coloured ellipse behind every bare image, so the page's contour lines fade out where a picture sits
   and stay visible around it (order: page, lines, veil, spotlight, image). Two offset ellipses so the falloff is not a box. */
:root{--img-veil:radial-gradient(farthest-side at 47% 52%,color-mix(in srgb,var(--base-bg) 94%,transparent) 62%,transparent 100%),
  radial-gradient(farthest-side at 54% 47%,color-mix(in srgb,var(--base-bg) 90%,transparent) 58%,transparent 98%)}
/* inside cards (rail, map panel, route thumbnails) the card already hides the lines: no veil there */
html.dg-ok :is(.card-p,.mp-fig,.br-pl).frame,:is(.card-p,.mp-fig,.br-pl).frame.bare{background:none}
html.dg-ok :is(.frame.contain,.k-diagram .c-mat,.c-svgbox,.lbox-svg)::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 80% at 0% 0%,color-mix(in srgb,var(--plate-highlight) var(--spot-a),transparent),transparent 75%),
    radial-gradient(70% 65% at 100% 100%,color-mix(in srgb,var(--plate-highlight) var(--spot-f),transparent),transparent 75%);
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent),linear-gradient(180deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent),linear-gradient(180deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent);mask-composite:intersect}
/* small solid fills on the main page (map markers, rail edge fades) follow the screen tone */
body{--solid:var(--ce-1)}
.dlayer ::selection{background:var(--detail-sheet-btn);color:var(--detail-sheet-btn-ink)}
.dlayer .fl.main{stroke:var(--link)}
/* the short summary on the gradient when the case study follows (tags row, then the case study's own title and lede) */
.d-tags{margin:0 0 1rem}
.d-sum{max-width:46ch}
.d-ct{margin:0 0 .35rem;font-weight:700;font-size:1.15rem;line-height:1.3}
.d-lede{margin:0;font:400 1.2rem/1.45 var(--serif)}
/* inline diagrams: lines, labels and fills come from --plate-ink, --plate-fill, --plate-highlight, --plate */
svg.dg{display:block;width:100%;height:100%;max-width:100%}
.c-mat svg.dg{height:auto}
.s4-card-img svg.dg{padding:8px}
.lbox-svg{position:relative;width:min(100%,1100px);padding:12px;border-radius:6px;background:var(--plate-bg)}
.lbox-svg[hidden]{display:none}
.lbox-svg svg.dg{height:auto;max-height:calc(100vh - 240px)}
/* while the lines stretch, shared elements fly in from the main page, so nothing is clipped */
.dlayer.is-anim,.dlayer.is-anim .dscroll{overflow:visible}
.dscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform-origin:50% 50%}
.dscroll:focus{outline:none}
/* the outgoing view during project-to-project travel (a painted copy, inert) */
.d-ghost{pointer-events:none}
/* the two divider lines at the edges of the expanded area, and the ones streaking past during travel */
.d-ln{--ln-c:color-mix(in srgb,var(--base-ink) 62%,transparent);position:fixed;left:0;top:0;width:100px;height:2px;z-index:46;pointer-events:none;background:linear-gradient(90deg,transparent,var(--ln-c) 8%,var(--ln-c) 92%,transparent)}
@media (max-width:767px){.d-ln{height:1.5px}}
.d-ln[hidden]{display:none}
body.d-open .d-ln{--ln-c:var(--ln-open)}
html.pc-on body.d-open .d-ln{--ln-c:var(--p-line)}
.d-seam{--ln-c:var(--p-line,var(--ln-open));position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--ln-c) 8%,var(--ln-c) 92%,transparent);pointer-events:none}
/* the corner widgets belong to the main page; they step aside while a project is expanded */
body.d-open .c-bl,body.d-open .c-br{opacity:0!important;visibility:hidden!important;transition:opacity .3s,visibility 0s .3s}
body.d-open .ctr-mini{display:none}
@media (max-width:767px){body.d-open .ctr-mini{display:inline}}
@media (max-width:599px){body.d-open .toplink{display:none}}
.d-top{max-width:var(--max);margin:0 auto;padding:clamp(20px,5vh,56px) var(--gut) clamp(28px,5vh,48px);display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(20px,4vw,64px);align-items:center}
.d-meta{display:flex;flex-wrap:wrap;gap:.35rem 1.3rem;margin:0 0 .8rem}
.d-t{margin:0 0 .6rem;font-weight:700;font-size:clamp(2.4rem,5.4vw,4.6rem);line-height:1.03;letter-spacing:-.02em;text-wrap:balance}
.d-line{margin:0 0 1.4rem;max-width:30ch;font:400 clamp(1.35rem,2.2vw,1.9rem)/1.25 var(--serif);font-style:italic}
.d-fig{margin:0;box-shadow:0 30px 60px -30px var(--detail-shadow)}
.d-fig.cover{aspect-ratio:4/3;max-height:58vh}
.d-fig.contain{aspect-ratio:16/10}
.d-fig.cutout{aspect-ratio:3/2;max-height:58vh;box-shadow:none}
.d-wrap{padding:0 var(--gut) clamp(40px,8vh,80px)}
/* paragraph-length text always sits on the cream card */
.d-sheet{max-width:var(--max);margin:0 auto;border-radius:16px;padding:clamp(20px,3.5vw,48px);background:var(--detail-card-bg);box-shadow:0 30px 60px -36px var(--detail-shadow);--fg:var(--detail-card-ink);--muted:var(--detail-card-ink);--rule:var(--detail-card-line);--hover:var(--detail-card-hover);--link:var(--detail-link);--link-ink:var(--detail-link-ink);--focus:var(--detail-link);--btn:var(--detail-sheet-btn);--btn-fg:var(--detail-sheet-btn-ink);--solid:var(--detail-card-solid);--card:var(--detail-card-bg);--card-fg:var(--detail-card-ink);--card-rule:var(--detail-card-line);--card-link:var(--detail-link);--plate-c:var(--plate-bg);--plate-l:var(--plate-line);--route:url(#sun-sheet);color:var(--fg)}
.d-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,4vw,64px);align-items:start}
.d-body{margin:0;max-width:62ch;font-size:1.125rem;line-height:1.7}
.d-sheet .facts{margin-top:0;padding-top:0;border-top:0;grid-template-columns:minmax(0,1fr)}
.d-sheet .fact{padding:.7rem 0;border-bottom:1px solid var(--rule)}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;margin:1.4rem 0 0;padding:0}
.tags li{border:1px solid var(--rule);border-radius:999px;padding:.35rem .75rem;font:600 .75rem/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.story-mount:empty{display:none}
.d-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;margin-top:clamp(28px,5vh,48px);padding-top:1rem;border-top:1px solid var(--rule)}
.d-nav a{display:flex;flex-direction:column;gap:.2rem;text-decoration:none;max-width:48%}
.d-nav a.nx{margin-left:auto;text-align:right;align-items:flex-end}
.d-nav b{font-weight:700;font-size:1.2rem;line-height:1.25}
.d-nav a:hover b{text-decoration:underline;text-underline-offset:.22em}

/* trail fork ("Where it leads"), inside the detail sheet */
.fork-wrap{margin:clamp(32px,6vh,56px) 0 0}
.conns-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1rem;margin:0 0 1rem;padding-bottom:.85rem;border-bottom:1px solid var(--rule)}
.conns-h .lbl:first-child{color:var(--fg)}
.fork{display:grid;grid-template-columns:minmax(150px,200px) clamp(56px,8vw,110px) minmax(0,1fr);align-items:stretch}
.here{align-self:center;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem}
.here-mk{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;box-shadow:0 0 0 5px var(--solid),0 0 0 6.5px currentColor;font:600 .9rem var(--mono);margin:0 0 .4rem 6px}
.here-t{font-weight:700;font-size:1.1rem;line-height:1.25}
.fork-lines{position:relative}
.fork-lines svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* fork lines draw in once: reason: shows the direction of travel, from here to each next project.
   Hidden start only after JS adds .fk-arm. */
.fl{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.6;stroke-dasharray:1 1;stroke-dashoffset:0;transition:stroke-dashoffset .9s var(--ease),opacity .2s}
.fl.main{stroke:var(--link);stroke:var(--route) var(--link);stroke-width:3;opacity:1}
.fl.hot{opacity:1;stroke-width:2.2}
.fk-arm .fl{stroke-dashoffset:1}
.br-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(.6rem,1.6vh,1rem)}
.br{position:relative;display:flex;align-items:stretch;gap:.4rem}
.br-a{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:center;gap:1rem;text-decoration:none;padding:.5rem .4rem .5rem 0;border-radius:10px;min-height:88px}
.br-why{position:relative;display:block;padding-bottom:.6rem;font:400 1.25rem/1.4 var(--serif)}
.br.main .br-why{font-size:1.32rem}
/* the underline is the end of the fork line, so it draws with it */
.br-why::after{content:"";position:absolute;left:0;right:-1rem;bottom:0;height:1.5px;background:currentColor;opacity:.6;transform-origin:0 50%;transition:transform .6s var(--ease) .5s,opacity .2s}
.br.main .br-why::after{height:3px;background:var(--link);background:linear-gradient(90deg,var(--detail-route-1),var(--detail-route-2));opacity:1}
.br.on .br-why::after{opacity:1}
.fk-arm .br-why::after{transform:scaleX(0)}
.br-dest{display:flex;align-items:center;gap:.8rem;min-width:0}
.br-mk{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;background:var(--solid);font:600 .75rem var(--mono)}
.br.main .br-mk{border-color:var(--link);border-width:2px}
.br-txt{display:flex;flex-direction:column;min-width:0;max-width:15rem}
.br-tag{color:var(--fg);margin-bottom:.1rem}
.br-ti{font-weight:700;font-size:1.15rem;line-height:1.25}
/* destination line fades in on hover, focus or first tap: reason: previews where the route goes */
.br-ln{font-size:1rem;line-height:1.4;opacity:0;transition:opacity .2s}
.br.on .br-ln{opacity:1}
/* touch: the first tap previews the route and shows this button; the second tap (on it or the row) opens it */
.br-open{display:none;align-self:flex-start;align-items:center;gap:.4rem;min-height:44px;margin-top:.4rem;padding:0 1rem;border-radius:999px;background:var(--btn);color:var(--btn-fg);font-weight:600;font-size:.95rem}
.br.on[data-armed="1"] .br-open{display:inline-flex}
.br-x{display:none;position:absolute;top:0;right:0;z-index:2;width:44px;height:44px;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--fg);font-size:1.7rem;line-height:1;cursor:pointer}
.br.on[data-armed="1"] .br-x{display:grid}
.br.on[data-armed="1"] .br-map{visibility:hidden}
.br-pl{flex:none;width:112px;aspect-ratio:4/3}
.br.main .br-pl{width:140px}
.br.on .br-pl{box-shadow:0 0 0 2px var(--link)}
.br.on .br-pl.cutout{box-shadow:none}
.br-map{flex:none;align-self:center;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--rule);color:var(--fg);font-size:1.05rem}
.br-map:hover,.br-map:focus-visible{border-color:currentColor}

.d-sheet+.d-sheet,.d-story+.d-sheet{margin-top:clamp(20px,4vh,32px)}
.d-leads .fork-wrap{margin-top:0}
.s-sketch{margin:.8rem 0 0;font-size:1rem}
.s-sketch a{font-weight:600;text-underline-offset:.22em}

.ghost:hover,.rbtn:hover:not(:disabled){border-color:currentColor}
/* ember-glow text boxes: one set for every card that holds text (reason: the box is lit by the same ember as the page) */
.d-sheet{-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.d-sheet{background-color:var(--detail-card-solid)}}
.dpage[data-side="l"]{--glow-x:24%}
.dpage[data-side="r"]{--glow-x:76%}
.d-story{--rule:var(--sketch-line);--card:var(--sketch-paper)}

/* ---------- case-study content: every section of the original page, as paper cards over the sunset ---------- */
.d-cols{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(20px,4vh,32px)}
.d-main{display:flex;flex-direction:column;gap:clamp(20px,4vh,32px);min-width:0}
.d-main>.d-sheet,.d-main>.d-story{margin:0;max-width:none}
.d-main>.d-sheet+.d-sheet,.d-main>.d-story+.d-sheet{margin-top:0}
.d-idx{display:none}
/* a small sticky index of the sections: reason: these pages are long */
@media (min-width:1100px){
  .d-cols.has-idx{grid-template-columns:200px minmax(0,1fr);align-items:start}
  .d-idx{display:block;position:sticky;top:20px}
  .d-idx ol{list-style:none;margin:.5rem 0 0;padding:0}
  .d-idx a{display:block;padding:.35rem 0 .35rem .8rem;border-left:2px solid var(--rule);text-decoration:none;font-weight:600;font-size:.95rem;line-height:1.3}
  .d-idx a:hover{border-left-color:var(--link)}
}
.d-sec{scroll-margin-top:12px}
/* section cards inside the expanded view rise in as they enter (card level only, so reading is undisturbed) */
.cr-arm{opacity:0}
/* the film player: a poster until clicked, so nothing is requested from YouTube before then */
.c-yt{margin:0 0 1.2rem}
.c-yt-box{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--plate-bg)}
.c-yt-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.c-yt-play{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;color:inherit}
.c-yt-play img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter)}
.c-yt-btn{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:var(--btn);display:grid;place-items:center;box-shadow:0 16px 36px -14px var(--detail-shadow);transition:transform .25s var(--ease-out)}
.c-yt-btn svg{width:28px;height:28px;margin-left:4px;fill:var(--btn-fg)}
.c-yt-play:hover .c-yt-btn,.c-yt-play:focus-visible .c-yt-btn{transform:scale(1.07)}
.c-yt-play:focus-visible{outline-offset:-4px}
.c-yt-lbl{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);padding:.45rem .75rem;border-radius:999px;background:var(--btn);color:var(--btn-fg);font:600 .8rem/1.3 var(--mono);letter-spacing:.03em}
.c-yt .c-cap{margin-top:.5rem}
.c-yt-out a{font-weight:600}
.c-h2{margin:0 0 1rem;font-weight:700;font-size:clamp(1.5rem,2.4vw,2.1rem);line-height:1.15;letter-spacing:-.01em}
.c-h2:focus{outline:none}
.c-h3{margin:1.6rem 0 .5rem;font-weight:700;font-size:1.2rem;line-height:1.3}
.c-lede{margin:0 0 1rem;max-width:44ch;font:400 1.35rem/1.4 var(--serif)}
.c-p,.c-list,.c-call{max-width:68ch}
.c-p{margin:0 0 1rem;font-size:1.0625rem;font-weight:500;line-height:1.7}
.c-note{font-size:.95rem}
.c-list{margin:0 0 1.1rem;padding-left:1.3rem;font-size:1.0625rem;line-height:1.6}
.c-list li{margin:.3rem 0}
.d-sec a:not([class]),.d-intro a:not([class]){text-decoration:underline;text-decoration-color:var(--link);text-decoration-thickness:1.5px;text-underline-offset:.2em}
.c-call{margin:0 0 1.2rem;padding:.8rem 1rem;border:1px solid var(--rule);border-left:3px solid var(--link);border-radius:8px;font-size:1rem;line-height:1.6}
.d-sec .secnote{margin:0 0 1.2rem}
.c-tbl{max-width:100%;overflow-x:auto;margin:0 0 1.2rem}
.c-tbl table{width:100%;border-collapse:collapse;font-size:1rem;line-height:1.5}
.c-tbl caption{caption-side:bottom;text-align:left;padding-top:.5rem;font:500 .8125rem/1.5 var(--mono)}
.c-tbl th{text-align:left;padding:.5rem .9rem .5rem 0;border-bottom:1px solid var(--rule);font:600 .75rem/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.c-tbl td{text-align:left;padding:.6rem .9rem .6rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
.c-tbl td:first-child{font-weight:700}
.c-gal{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;margin:0 0 1.3rem}
@media (min-width:768px){.c-gal.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.c-gal.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.c-fig{margin:0;min-width:0}
.c-zoom{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;color:inherit}
/* photos uncropped on a paper mat; diagrams on the ember plate; nothing recoloured */
.c-mat{display:block;width:100%;max-height:70vh;border-radius:6px;overflow:hidden;background:var(--c-mat);border:1px solid var(--rule)}
.c-mat img{display:block;width:100%;height:100%;object-fit:contain}
.k-photo .c-mat img{filter:var(--photo-filter)}
.k-diagram .c-mat{background:var(--plate-bg);border-color:var(--plate-line)}
.k-cutout .c-mat{background:none;border:0}
.c-cap{margin:.5rem 0 0;font:500 .8125rem/1.5 var(--mono)}
.c-svg{--ink:var(--svg-ink);--ink-soft:var(--svg-ink-soft);--bg:var(--svg-bg);--surface:var(--svg-surface);--line:var(--svg-line);--accent:var(--svg-accent);--accent-soft:var(--svg-accent-soft);margin:0 0 1.2rem}
.c-svgbox{background:var(--plate-bg);border-radius:6px;padding:1rem;overflow-x:auto;color:var(--svg-ink)}
.c-svg svg{display:block;max-width:100%;height:auto;margin:0 auto}
.c-vid video{display:block;width:100%;max-height:70vh;border-radius:6px;background:var(--plate-bg)}
.c-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem 1.6rem;margin:0 0 1.3rem;padding:0}
.c-stat{display:flex;flex-direction:column;gap:.25rem;margin:0}
.c-stat .v{order:-1;margin:0;font-weight:700;font-size:clamp(1.45rem,2.3vw,2rem);line-height:1.1;font-variant-numeric:tabular-nums}
.c-stat dt{font:600 .75rem/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.c-stat .n{margin:0;font-size:.95rem}
.c-steps{list-style:none;margin:0 0 1.3rem;padding:0;counter-reset:cs;display:grid;gap:.8rem;max-width:68ch}
.c-steps li{display:grid;grid-template-columns:2.2rem minmax(0,1fr);column-gap:.8rem;counter-increment:cs}
.c-steps li::before{content:counter(cs,decimal-leading-zero);grid-row:1/3;font:600 .9rem/1.6 var(--mono)}
.c-steps .lbl{display:block}
.c-steps .c-sx{font-size:1.0625rem;line-height:1.6}
.c-links{list-style:none;margin:0 0 1.3rem;padding:0;display:flex;flex-direction:column;gap:.7rem;max-width:68ch}
.c-links.btns{flex-direction:row;flex-wrap:wrap}
.c-la{font-weight:700;font-size:1.0625rem;text-decoration:underline;text-decoration-color:var(--link);text-decoration-thickness:1.5px;text-underline-offset:.2em}
.c-ln{display:block;font-size:1rem;line-height:1.5}
.c-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin:0 0 1.3rem}
.c-card{border:1px solid var(--rule);border-radius:10px;padding:1rem 1.1rem}
.c-card h4{margin:0 0 .4rem;font-size:1.15rem}
.c-card p{margin:0 0 .5rem;font-size:1rem;line-height:1.55}
.c-code{margin:0 0 1.2rem;padding:1rem;max-width:100%;overflow-x:auto;border-radius:8px;background:var(--c-code-bg);font:500 .875rem/1.55 var(--mono);white-space:pre}
.c-embed{display:flex;flex-direction:column;gap:.3rem;max-width:40rem;margin:0 0 1.2rem;padding:1rem 1.1rem;border:1px solid var(--rule);border-radius:10px;text-decoration:none}
.c-embed b{font-size:1.1rem}
.c-ph{margin:0 0 1.2rem;padding:1rem;border:1px dashed var(--rule);border-radius:8px}
.d-top-solo{grid-template-columns:minmax(0,1fr)}
/* lightbox: a closer look at one image, inside the expanded page */
/* the image grows in place from its spot in the page (reason: a closer look at the same thing, not a new window) */
.lbox{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:64px 16px 20px;color:var(--detail-ink);cursor:zoom-out}
.lbox-dim{position:absolute;inset:0;background:var(--lbox-bg)}
.lbox[hidden]{display:none}
.lbox img{position:relative;max-width:100%;max-height:calc(100% - 4rem);object-fit:contain}
.lbox p{position:relative;margin:0;max-width:60ch;text-align:center;font:500 .875rem/1.5 var(--mono)}
.lbox-x{position:absolute;z-index:1;left:var(--gut);top:12px;border:0;border-radius:999px;padding:.65rem 1rem;background:var(--detail-btn-bg);color:var(--detail-btn-ink);font-weight:600;cursor:pointer}
@media (max-width:479px){
  .c-tbl.c-3 thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .c-tbl.c-3 table,.c-tbl.c-3 tbody,.c-tbl.c-3 tr,.c-tbl.c-3 td{display:block;width:100%}
  .c-tbl.c-3 tr{padding:.5rem 0;border-bottom:1px solid var(--rule)}
  .c-tbl.c-3 td{border:0;padding:.15rem 0}
  .c-tbl.c-3 td::before{content:attr(data-label);display:block;font:600 .75rem/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase}
}

/* ---------- live sketch (story component, lifted from story-4-sketch.html), scoped under .s4 ----------
   A paper card in both themes: it is an ink drawing on paper. */
.d-story{max-width:var(--max);margin:clamp(20px,4vh,32px) auto 0;border-radius:16px;background:var(--sketch-paper)}
.s4{--s4-paper:var(--sketch-paper);--s4-ink:var(--sketch-ink);--s4-accent:var(--detail-route-2);--s4-link:var(--detail-link);--s4-muted:var(--sketch-ink);--s4-label:var(--sketch-label);--s4-note:var(--sketch-note);
  --s4-serif:var(--serif);--s4-sans:var(--sans);--s4-ease:cubic-bezier(.2,.7,.1,1);
  --focus:var(--detail-link);position:relative;color:var(--s4-ink);background:var(--s4-paper)}
.s4 *,.s4 *::before,.s4 *::after{box-sizing:border-box}
.s4-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px;padding:0;border:0}
.s4-track{position:relative;height:420vh}
/* the stage pins inside the detail page's own scroller, just under its top bar */
.s4-stage{position:sticky;top:var(--s4-top,0px);height:calc(var(--s4-vh,100vh) - var(--s4-top,0px));max-width:1200px;margin:0 auto;padding:clamp(14px,3vh,28px) 16px clamp(10px,2vh,20px);display:flex;flex-direction:column}
.s4-head{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.2rem 1rem}
.s4-title{margin:0;font:400 1.6rem/1.2 var(--s4-serif);letter-spacing:0}
/* what to do with the drawing: shown until it has finished drawing */
.s4-how{flex:1 0 100%;order:3;display:flex;align-items:center;gap:.5rem;margin:.35rem 0 0;font:500 .95rem/1.4 var(--s4-sans);color:var(--s4-ink);transition:opacity .4s ease}
.s4-how svg{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
.s4-how.is-done{opacity:0}
.s4-skip{font:500 .875rem/1.3 var(--s4-sans);color:var(--s4-ink);text-decoration:underline;text-underline-offset:.2em;white-space:nowrap}
.s4-skip:hover{color:var(--s4-link)}
.s4 a:focus-visible,.s4 button:focus-visible{outline:2px solid var(--s4-link);outline-offset:2px;border-radius:4px}
.s4-after{display:block;height:0;outline:none}
.s4-art{position:relative;flex:1 1 auto;min-height:0;margin-top:.4rem}
.s4-svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.s4-svg path{fill:none;stroke:var(--s4-ink);stroke-linecap:round;stroke-linejoin:round}
.s4-svg path.s4-hatch{stroke-opacity:.5}
.s4-svg path.s4-fillp{fill:var(--s4-paper);stroke:none}
.s4-svg path.s4-hl.is-cur{stroke:var(--s4-accent)}
.s4-svg text{font-family:var(--s4-serif);font-style:italic;font-size:15px;fill:var(--s4-label)}
.s4-svg text.s4-hl.is-cur{fill:var(--s4-link)}
.s4--phone .s4-svg text{font-size:19px}
.s4-nib{fill:var(--s4-accent);stroke:none}
/* a drawn group under the pointer or focus: accent red, slightly thicker (reason: shows what the card describes) */
.s4-svg path.is-hot{stroke:var(--s4-accent);stroke-width:calc(var(--w,1.6) * 1px + .9px)}
.s4-svg text.is-hot{fill:var(--s4-link)}
/* hit areas: a near-invisible paint rather than "transparent" (some mobile browsers skip fully transparent strokes) */
.s4-svg .s4-hitr{fill:var(--s4-hit);stroke:none;pointer-events:all;cursor:pointer}
.s4-svg .s4-hitp{fill:none;stroke:var(--s4-hit);stroke-width:20px;pointer-events:stroke;cursor:pointer}
@media (hover:none){.s4-svg .s4-hitp{stroke-width:34px}}
.s4-ov{position:absolute;left:0;top:0;pointer-events:none}
.s4-cap{position:relative;grid-area:1/1;width:100%;text-align:center;font:italic 400 1em/1.35 var(--s4-serif);pointer-events:none;color:var(--s4-ink)}
/* caption crossfade: reason: one line says what the step being drawn shows */
.s4-cap>span{display:block;opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .5s var(--s4-ease)}
.s4-cap.is-on>span{opacity:1;transform:none}
.s4-capline{display:grid;flex:none;min-height:3.2em;margin:.3rem auto 0;width:min(100%,32rem);padding:0 24px;font-size:1.25rem}
.s4-step{position:absolute;margin:0;padding:0;border:0;background:transparent;pointer-events:none;border-radius:10px}
.s4-step[hidden]{display:none}
.s4 .s4-step:focus-visible{outline:1.5px dashed var(--s4-link);outline-offset:3px;border-radius:10px}
.s4-hint{position:absolute;z-index:3;pointer-events:none;white-space:nowrap;padding:0 .3em;background:var(--s4-paper);font:italic 400 1.25rem/1.2 var(--s4-serif);color:var(--s4-link);opacity:0;transform:rotate(-3deg);transition:opacity .6s ease}
.s4-hint.is-up{transform:translateY(-100%) rotate(-3deg)}
.s4-hint.is-on{opacity:1}
/* page preview card: hover peeks at the page the line leads to, click pins and expands it */
.s4-card{position:absolute;left:0;top:0;z-index:6;width:min(280px,calc(100vw - 32px));pointer-events:none;visibility:hidden;transition:visibility 0s linear .26s;will-change:transform}
.s4-card.is-on{visibility:visible;transition-delay:0s}
.s4-card.is-pin{pointer-events:auto;width:min(300px,calc(100vw - 32px))}
.s4-card-in{position:relative;background:var(--s4-note);color:var(--s4-ink);border:1px solid var(--sketch-line);border-radius:6px 10px 7px 11px/10px 6px 11px 7px;overflow:hidden;
  box-shadow:0 22px 40px -22px var(--sketch-shadow),0 2px 6px -2px var(--sketch-shadow-2);
  opacity:0;transform:scale(.55);transform-origin:0 0;transition:opacity .22s ease,transform .28s var(--s4-ease)}
.s4-card.is-on .s4-card-in{opacity:1;transform:none}
.s4-card.is-pin .s4-card-in{overflow:auto}
.s4-card-img{height:118px;background:var(--sketch-photo-bg);overflow:hidden}
.s4-card-img.is-contain{background:var(--plate-bg)}
.s4-card-img img{display:block;width:100%;height:100%;object-fit:cover;filter:var(--photo-filter)}
.s4-card-img.is-contain img{object-fit:contain;padding:8px;filter:none}
.s4-card-img.is-cutout{background:transparent}
.s4-card-img.is-cutout img{object-fit:contain;padding:8px 8px 4px;filter:drop-shadow(0 8px 8px var(--sketch-shadow-2))}
.s4-card-body{padding:.6rem .85rem .7rem}
.s4-card-lbl{margin:0 0 .3rem;font:600 .75rem/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--s4-ink)}
.s4-card-cap{margin:0;font:italic 400 1.25rem/1.3 var(--s4-serif)}
.s4-card-txt{margin:.25rem 0 0;font:500 .95rem/1.5 var(--s4-sans)}
.s4-card-foot{margin:.45rem 0 0;font:600 .82rem/1.3 var(--s4-sans);color:var(--s4-link)}
.s4-card-step+.s4-card-step{border-top:1px solid var(--sketch-rule);margin-top:.7rem;padding-top:.7rem}
.s4-card-go{display:inline-block;margin-top:.5rem;padding:.3rem .7rem;border:1px solid var(--s4-link);border-radius:4px 7px 5px 8px;color:var(--s4-link);font:600 .875rem/1.3 var(--s4-sans);text-decoration:none}
a.s4-card-go:hover{background:var(--s4-link);color:var(--s4-note)}
span.s4-card-go{border-style:dashed}
.s4-card-x{display:block;margin:.7rem 0 0 auto;border:0;background:transparent;padding:.2rem 0;cursor:pointer;font:600 .85rem/1.3 var(--s4-sans);color:var(--s4-ink);text-decoration:underline;text-underline-offset:.2em}
.s4-ticks{position:absolute;right:2px;top:50%;transform:translateY(-50%);list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
/* progress ticks: reason: how far through the seven steps you are */
.s4-ticks li{width:14px;height:2px;border-radius:2px;background:var(--s4-ink);opacity:.2;transform-origin:100% 50%;transition:opacity .3s,transform .3s var(--s4-ease)}
.s4-ticks li:nth-child(odd){border-radius:2px 1px}
.s4-ticks li.is-done{opacity:.7}
.s4-ticks li.is-cur{opacity:1;background:var(--s4-accent);transform:scaleX(1.6)}
.s4-list{display:none}
/* the generic drawings: colours through the --sk-* variables of the files; tabs when a project has several */
.skx{--sk-ink:var(--s4-ink);--sk-accent:var(--s4-accent);--sk-fill:color-mix(in srgb,var(--s4-ink) 7%,transparent)}
.skx-svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;overflow:visible}
.skx-ov{inset:0;width:100%;height:100%}
.skx-host.s4--arrow .s4-track{height:auto}
.skx-host.s4--arrow .s4-stage{position:relative;top:0;height:auto}
.skx-host.s4--arrow .s4-art{flex:none;aspect-ratio:var(--s4-ar,5 / 3);width:min(100%,calc(66vh * var(--s4-arn,1.667)));margin:.4rem auto 0}
.skx-tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 16px .4rem}
.skx-tab{min-height:40px;padding:.35rem .9rem;border:1px solid var(--sketch-line);border-radius:999px;background:transparent;color:var(--s4-ink);font:600 .9rem/1.2 var(--s4-sans);cursor:pointer}
.skx-tab[aria-selected="true"]{border-color:var(--s4-link);color:var(--s4-link);background:color-mix(in srgb,var(--s4-link) 10%,transparent)}
.skx-tab:hover{border-color:var(--s4-link)}
.skx-tab[hidden]{display:none}
/* pictures that open their project */
[role="button"][data-open]{cursor:pointer}
/* the step bar: always there; on touch and narrow screens it is the way through the drawing */
.s4-ctl{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.3rem .7rem;margin:.35rem auto 0}
.s4-arw{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;min-width:44px;padding:0 1rem;border:1px solid var(--sketch-line);border-radius:999px;background:transparent;color:var(--s4-ink);font:600 .95rem/1 var(--s4-sans);cursor:pointer}
.s4-arw:hover:not(:disabled){border-color:var(--s4-link);color:var(--s4-link)}
.s4-arw:disabled{opacity:.4;cursor:default}
.s4-count{min-width:3.6em;text-align:center;font:600 .8rem/1 var(--mono);color:var(--s4-ink)}
.s4 .s4-ctl .s4-ticks{position:static;transform:none;display:flex;flex-direction:row;gap:0;margin:0}
.s4 .s4-ctl .s4-ticks li{width:auto;height:auto;background:none;opacity:1;transform:none!important;border-radius:0}
.s4-dot{position:relative;display:block;width:24px;height:44px;padding:0;border:0;background:none;cursor:pointer}
.s4-dot::before{content:"";position:absolute;left:5px;right:5px;top:21px;height:2px;border-radius:2px;background:var(--s4-ink);opacity:.25;transition:opacity .3s,background-color .3s}
.s4-ticks li.is-done .s4-dot::before{opacity:.7}
.s4-ticks li.is-cur .s4-dot::before{top:20px;height:4px;background:var(--s4-accent);opacity:1}
/* arrow mode: a normal-height card, no tall scroll track and no pinning */
.s4.s4--arrow .s4-track{height:auto}
.s4.s4--arrow .s4-stage{position:relative;top:0;height:auto}
.s4.s4--arrow .s4-art{flex:none;aspect-ratio:var(--s4-ar,5 / 3);width:min(100%,calc(66vh * var(--s4-arn,1.667)));margin:.4rem auto 0}
.s4--phone .s4-track{height:310vh}
.s4--phone .s4-title{font-size:1.4rem}
.s4--phone .s4-capline{padding:0;font-size:1.25rem}
.s4--phone .s4-ticks{position:static;transform:none;flex:none;flex-direction:row;justify-content:center;gap:8px;margin:.25rem 0 0}
.s4--phone .s4-ticks li{width:12px;transform-origin:50% 50%}
.s4--phone .s4-ticks li.is-cur{transform:scaleX(1.5)}
/* touch: the card is docked inside the stage (in flow with the drawing), unfolding from the part you tapped */
.s4-card.is-dock{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-width:440px;margin:0 auto;transform:none!important;z-index:7}
.s4-card.is-dock .s4-card-in{border-radius:12px}
/* the close button on every tapped or pinned preview */
.s4-card-close{position:absolute;top:4px;right:4px;z-index:2;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--s4-note);color:var(--s4-ink);font:400 1.7rem/1 var(--s4-sans);cursor:pointer}
.s4-card-close:hover{color:var(--s4-link)}
.s4-card-more{display:inline-flex;align-items:center;min-height:44px;margin-top:.6rem;padding:0 1.1rem;border:1px solid var(--s4-link);border-radius:8px;background:transparent;color:var(--s4-link);font:600 .95rem/1.2 var(--s4-sans);cursor:pointer}
@media (hover:none){.s4-card-go,.s4-card-x{display:inline-flex;align-items:center;min-height:44px}.s4-card-go{padding:0 1rem}.s4-card-x{padding:0 .4rem}}
.s4--static .s4-track{height:auto}
.s4--static .s4-stage{position:relative;top:0;height:auto}
.s4--static .s4-art{flex:none;aspect-ratio:var(--s4-ar,5 / 3);width:min(100%,calc(78vh * var(--s4-arn,1.667)));margin:.4rem auto 0}
.s4--static .s4-capline,.s4--static .s4-ticks{display:none}
.s4--static .s4-list{display:block;columns:2;column-gap:2.5rem;margin:.5rem auto 0;padding-left:1.6rem;width:min(100%,46rem);font:italic 400 1.25rem/1.45 var(--s4-serif)}
.s4--static .s4-list li{margin:0 0 .3rem;break-inside:avoid}
.s4--phone.s4--static .s4-list{columns:1}
.s4-play{display:none;margin:.6rem auto 0;border:0;background:transparent;padding:.2rem .4rem;cursor:pointer;font:600 .9rem/1.3 var(--s4-sans);color:var(--s4-ink);text-decoration:underline;text-underline-offset:.2em}
.s4-play:hover{color:var(--s4-link)}
.s4--static.s4--rm .s4-play{display:block}
.s4--static{padding-bottom:16px}
/* (formerly only with OS reduced motion; now the mode classes decide) */
  html:not(.mo-on) .s4 *,html:not(.mo-on) .s4 *::before,html:not(.mo-on) .s4 *::after{transition:none!important}
  html:not(.mo-on) .s4 .s4-card-in{transform:none!important;transition:opacity .2s ease!important}


/* ---------- ONE text-box style for the whole page (reason: every box is lit by the same ember as the page) ----------
   Paper with a warm glow in light, dark glass with an ember glow in dark; the glow rises from the bottom edge,
   at most 120px tall, so it never grows behind long text. Chips, buttons and table cells do not get it. */
.card,.mpanel,.elabel,.secnote,.c-call,.d-sheet,.d-story,.s4-card-in,.pop,.tourbox,.ctr-box,.theme-joke,.c-card,.c-embed,.c-tbl,.d-idx,.lbox p,.b-block,.ai-box,.foot{
  --gx:var(--glow-x,50%);--gy:100%;
  background-image:radial-gradient(var(--gsz,var(--card-glow-size)) at var(--gx) var(--gy),color-mix(in srgb,var(--card-glow) calc(var(--gi,1) * 100%),transparent),color-mix(in srgb,var(--card-glow-2) calc(var(--gi,1) * 100%),transparent) 55%,transparent 100%);background-repeat:no-repeat;
  border:1px solid var(--rule);border-bottom-color:var(--card-line-warm);box-shadow:var(--card-shadow)}
.secnote,.c-call{border-left:3px solid var(--link)}
.card:hover,.card:focus-visible{border-color:currentColor}
.c-code{border:1px solid var(--rule)}
.c-tbl{padding:.4rem 1rem .6rem;border-radius:10px}
.d-idx{padding:1rem 1rem 1.1rem;border-radius:14px}
.lbox p{padding:.6rem .9rem;border-radius:10px}
.b-block{padding:clamp(18px,2.5vw,28px);border-radius:16px}
.ai-box{padding:clamp(20px,3vw,36px);border-radius:16px}
.foot{padding:1.2rem 1.4rem;border-radius:16px}
.c-card,.c-embed{border-radius:12px}

/* =====================================================================
   HOVER RESPONSES (fine pointers): one delegated pointermove writes --mx / --my (0..1 inside the element) on the
   one element under the pointer, and adds .hv plus a recipe class (.hv-cards, .hv-fig ...). Everything here is
   transform, opacity or paint (custom properties, colours); nothing changes layout. In 180ms, out 350ms.
   Keyboard focus gets the same resting look (centred light, no pointer-follow).
   Mode classes: html.mo-lite (Reduced) keeps light, border and colour with at most 1.01 scale and no tilt;
   without .mo-on (Off) only colours change.
   ===================================================================== */
@property --mx{syntax:"<number>";inherits:true;initial-value:.5}
@property --my{syntax:"<number>";inherits:true;initial-value:.5}
@property --gx{syntax:"<length-percentage>";inherits:false;initial-value:50%}
@property --gy{syntax:"<length-percentage>";inherits:false;initial-value:100%}
[class*="hv-"]{transition-property:scale,translate,transform,box-shadow,border-color,background-color,color,filter,text-decoration-color,text-decoration-thickness;
  transition-duration:.35s;transition-timing-function:cubic-bezier(.2,.7,.1,1)}
.hv{transition-duration:.18s}
/* the card's glow is a free light: the blob loop in the script moves it (--gx, --gy), reshapes it (--gsz) and sets its
   strength (--gi); at rest it is the usual edge glow from the shared text-box rule */
/* the hairline brightens toward the accent on the edge nearest the pointer */
.hv-cards,.hv-cardw{position:relative}
.d-idx.hv-cards{position:sticky}
.hv-cards::after,.hv-cardw::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;padding:1px;pointer-events:none;
  background:radial-gradient(180px circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),var(--link),transparent 70%);
  -webkit-mask:linear-gradient(var(--base-ink) 0 0) content-box,linear-gradient(var(--base-ink) 0 0);-webkit-mask-composite:xor;
  mask-image:linear-gradient(var(--base-ink) 0 0),linear-gradient(var(--base-ink) 0 0);mask-clip:content-box,border-box;mask-composite:exclude;
  opacity:0;transition:opacity .35s ease}
.hv-cards.hv::after,.hv-cardw.hv::after{opacity:.85;transition-duration:.18s}
/* lift and size: small cards most, wide text boxes barely (reading is never disturbed), back matter in between */
.hv-cards.hv{scale:1.02;translate:0 -3px}
.mpanel.hv-cards.hv,.d-idx.hv-cards.hv{scale:1.01;translate:0 -2px}
.hv-cardw.hv{scale:1.005}
:is(.b-block,.ai-box,.foot).hv-cardw.hv{scale:1.008;translate:0 -2px}
/* image plates and content figures: tilt toward the pointer, the picture leans in, the caption settles */
.hv-fig.hv{transform:perspective(900px) rotateX(calc((.5 - var(--my)) * 5deg)) rotateY(calc((var(--mx) - .5) * 5deg))}
:is(.hv-fig,.hv-plate) :is(img,svg.dg){transition:scale .35s cubic-bezier(.2,.7,.1,1),filter .35s ease}
:is(.hv-fig,.hv-plate).hv :is(img,svg.dg){scale:1.03;transition-duration:.18s}
/* diagrams: lines and the highlighted path gain a touch of contrast */
:is(.hv-fig,.hv-plate).hv svg.dg{filter:contrast(1.08) saturate(1.12)}
.hv-fig figcaption{transition:translate .35s ease}
.hv-fig.hv figcaption{translate:0 2px;transition-duration:.18s}
/* fact numbers nudge up and an underline draws */
.hv-fact dd:not(.n){background-image:linear-gradient(var(--link),var(--link));background-repeat:no-repeat;background-position:0 100%;background-size:0% 2px;
  transition:translate .35s cubic-bezier(.2,.7,.1,1),background-size .35s ease}
.hv-fact.hv dd:not(.n){translate:0 -2px;background-size:100% 2px;transition-duration:.18s}
/* tags: the fill warms and the chip grows a little */
.hv-chip.hv{scale:1.04;border-color:var(--link);background-color:color-mix(in srgb,var(--link) 14%,transparent)}
/* buttons and pills: a sheen follows the pointer across the fill (the gradient's light shifts), slight grow */
.hv-btn{position:relative;isolation:isolate}
.hv-btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%),var(--hv-sheen),transparent 68%);opacity:0;transition:opacity .35s ease}
.hv-btn.hv::before{opacity:1;transition-duration:.18s}
.hv-btn.hv{scale:1.03}
.cta:active,.ghost:active,.pill:active,.btn-tour:active,.rbtn:active,.cue:active,.bchip:active,.tourbox button:active,.s4-arw:active{scale:.97!important}
/* links in text: the underline thickens and turns to the accent */
.hv-link.hv{color:var(--link);text-decoration-line:underline;text-decoration-color:var(--link);text-decoration-thickness:2.5px}
#chrome .hv-link.hv{color:var(--bar-acc);text-decoration-color:var(--bar-acc)}
/* list items (On this page, prev/next, links, chapter and end indexes, map list): indent 4px, the marker warms */
.hv-item.hv{translate:4px 0}
.d-nav a.nx.hv-item.hv{translate:-4px 0}
.d-idx .hv-item.hv a{border-left-color:var(--link)}
/* table rows: a tint follows the pointer along the row; the first cell's accent bar grows */
.hv-row.hv{background-image:radial-gradient(260px 100% at calc(var(--mx) * 100%) 50%,color-mix(in srgb,var(--link) 12%,transparent),transparent)}
.hv-row td:first-child{box-shadow:inset 0 0 0 var(--link);transition:box-shadow .35s ease}
.hv-row.hv td:first-child{box-shadow:inset 3px 0 0 var(--link);transition-duration:.18s}
/* code: a faint band marks the line under the pointer */
.hv-code.hv{background-image:linear-gradient(180deg,transparent calc(var(--my) * 100% - .8em),color-mix(in srgb,var(--link) 10%,transparent) calc(var(--my) * 100% - .8em),color-mix(in srgb,var(--link) 10%,transparent) calc(var(--my) * 100% + .8em),transparent calc(var(--my) * 100% + .8em))}
/* the wordmark: the italic leans a little further, the caps track out (scaled, so nothing reflows) */
.hv-mark .mk-1,.hv-mark .mk-2{transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.hv-mark .mk-2{transform-origin:0 50%}
.hv-mark.hv .mk-1{transform:skewX(-4deg)}
.hv-mark.hv .mk-2{transform:scaleX(1.05)}
/* the theme switch: the knob leans toward the pointer */
.hv-theme .tt-knob{transition:transform .35s cubic-bezier(.3,1.5,.5,1),background-color .3s ease,box-shadow .3s ease,translate .25s ease}
.hv-theme.hv .tt-knob{translate:calc((var(--mx) - .5) * 6px) 0}
/* Reduced: light, border and colour stay; at most 1.01, no tilt, no travel */
html.mo-lite :is(.hv-cards,.hv-cardw,.hv-btn,.hv-chip).hv{scale:1.01;translate:none}
html.mo-lite :is(.hv-item,.hv-fact dd).hv,html.mo-lite .hv-fact.hv dd:not(.n){translate:none}
html.mo-lite .hv-fig.hv{transform:none}
html.mo-lite :is(.hv-fig,.hv-plate).hv :is(img,svg.dg){scale:1.01}
html.mo-lite .hv-theme.hv .tt-knob{translate:none}
/* Off: colours only */
html:not(.mo-on) .hv,html:not(.mo-on) .hv *{scale:none!important;translate:none!important}
html:not(.mo-on) .hv-fig.hv,html:not(.mo-on) .hv-mark.hv .mk-1,html:not(.mo-on) .hv-mark.hv .mk-2{transform:none}
/* the quiet offer to reduce motion (only shown when the OS asks for reduced motion) */
.mo-hint{display:inline-flex;align-items:center;gap:.2rem;font-size:.85rem;font-weight:600}
.mo-hint[hidden]{display:none}
.mo-hint button{padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.mo-hint [data-mo-reduce]{text-decoration:underline;text-underline-offset:.2em}
.mo-hint [data-mo-dismiss]{width:28px;height:28px;font-size:1.2rem;line-height:1}
@media (max-width:1023px){#chrome .mo-hint{display:none}}
/* the sketch is a text box like the others: the same rounded glass or paper card with the ember glow, inset from the edges
   (solid, not blurred glass: a backdrop filter would re-anchor the sketch's fixed phone card to the box) */
.d-story.s4,.d-story{--s4-paper:var(--detail-card-solid);background-color:var(--detail-card-solid);border-radius:16px;padding:clamp(6px,1.4vw,16px)}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  .fig.cover{aspect-ratio:4/5;max-height:none}
  .map-grid{grid-template-columns:minmax(0,1fr)}
  .mconn{display:none}
  .tp{grid-template-columns:minmax(0,1fr)}
  .tp-plate{max-width:560px}
  .b-grid,.ai-box,.d-grid{grid-template-columns:minmax(0,1fr)}
  .d-top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:767px){
  :root{--bar:58px}
  .sgrid,.sgrid.rev{display:flex;flex-direction:column;align-items:stretch}
  .s-media,.sgrid.rev .s-media{order:-1;margin:0 0 18px;width:100%}
  .s-text{width:100%}
  .c-br{display:none}
  .stop{padding:48px var(--gut)}
  .s-end{margin-top:40px}
  .s-rule{margin-bottom:14px}
  .s-num{font-size:3rem}
  .map{padding-top:72px}
  .back{padding-top:96px}
  .fig.cover{aspect-ratio:3/2;max-height:34vh}
