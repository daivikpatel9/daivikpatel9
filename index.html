      st.setProperty("--gsz", sw.toFixed(1) + "px " + sh.toFixed(1) + "px"); st.setProperty("--gi", gi.toFixed(3));
    }
    function bClear(b) { ["--gx", "--gy", "--gsz", "--gi"].forEach(function (k) { b.el.style.removeProperty(k); }); }
    function bFrame(now) {
      bRaf = 0;
      var dt = Math.min(.05, (now - bLast) / 1000); bLast = now;
      if (rectsDirty) { rectsDirty = false; blobs.forEach(measureB); }
      var k = 1 - Math.exp(-dt / .14), keep = [];
      blobs.forEach(function (b) {
        if (b.mode === "follow") {
          var tx = clamp(px - b.l, 0, b.w), ty = clamp(py - b.t, 0, b.h);
          if (lite()) { tx = b.rx + (tx - b.rx) * .25; ty = b.ry + (ty - b.ry) * .25; }
          b.x += (tx - b.x) * k; b.y += (ty - b.y) * k;
          bWrite(b); keep.push(b);
        } else {
          var t = clamp((now - b.f0) / 620, 0, 1);
          var py0 = t < .78 ? 1.035 * Math.pow(t / .78, 2) : 1.035 - .035 * (1 - Math.pow(1 - (t - .78) / .22, 2));
          var px0 = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          b.x = b.fx + (b.rx - b.fx) * px0; b.y = b.fy + (b.ry - b.fy) * py0;
          if (t < 1) { bWrite(b); keep.push(b); } else bClear(b);
        }
      });
      blobs = keep;
      if (blobs.length) bRaf = requestAnimationFrame(bFrame);
    }
    document.addEventListener("scroll", function () { if (blobs.length) rectsDirty = true; }, { passive: true, capture: true });   /* the page or the expanded view scrolling */
    window.addEventListener("resize", function () { if (blobs.length) rectsDirty = true; });
    function cardOf(t) { return t ? (t.matches(BLOBSEL) ? t : t.parentElement && t.parentElement.closest(BLOBSEL)) : null; }
    var lit = null;
    function set(t) {
      var nc = cardOf(t);
      if (nc !== lit) { if (lit) blobOff(lit); lit = nc; if (lit) blobOn(lit); }
      if (t === cur) return;
      var nb = t && t.parentElement ? t.parentElement.closest(CARD) : null;
      if (cur && cur !== nb) off(cur);
      if (box && box !== nb && box !== t) off(box);
      cur = t; box = nb && nb !== t ? nb : null;
      if (cur) on(cur);
      if (box) on(box);
    }
    function frame() {
      raf = 0;
      if (!cur) return;
      var r = cur.getBoundingClientRect(); if (!r.width || !r.height) return;
      cur.style.setProperty("--mx", clamp((px - r.left) / r.width, 0, 1).toFixed(3));
      cur.style.setProperty("--my", clamp((py - r.top) / r.height, 0, 1).toFixed(3));
    }
    document.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse" || !FH.matches) return;
      px = e.clientX; py = e.clientY;
      set(e.target.closest ? e.target.closest(ALL) : null);
      if (lit && !bRaf) { bLast = performance.now(); bRaf = requestAnimationFrame(bFrame); }
      if (cur && !raf) raf = requestAnimationFrame(frame);
    }, { passive: true });
    document.addEventListener("pointerout", function (e) { if (!e.relatedTarget) set(null); });
    /* keyboard: the same resting look, centred, no pointer-follow */
    document.addEventListener("focusin", function (e) {
      var t = e.target.closest && e.target.closest(ALL);
      if (!t || !e.target.matches(":focus-visible")) return;
      t.style.removeProperty("--mx"); t.style.removeProperty("--my");
      on(t); t.__kf = 1;
    });
    document.addEventListener("focusout", function (e) {
      var t = e.target.closest && e.target.closest(ALL);
      if (t && t.__kf) { t.__kf = 0; if (t !== cur && t !== box) off(t); }
    });
  })();

  /* ---------- the quiet offer to reduce motion: only when the OS asks for it, once, remembered ---------- */
  (function () {
    var seen = false; try { seen = !!localStorage.getItem("fg-motion") || localStorage.getItem("fg-motion-hint") === "1"; } catch (e) {}
    if (!RM.matches || seen || MODE !== "full") return;
    function hint() {
      var s = document.createElement("span");
      s.className = "mo-hint";
      s.innerHTML = '<button type="button" data-mo-reduce>Too much motion? Reduce it</button><button type="button" data-mo-dismiss aria-label="Dismiss">&times;</button>';
      return s;
    }
    var spots = [], ctl = $("mo-ctl"), about = document.querySelector("#chrome .toplink");
    if (ctl && ctl.parentNode) { var a = hint(); ctl.parentNode.appendChild(a); spots.push(a); }
    if (about) { var b = hint(); about.parentNode.insertBefore(b, about); spots.push(b); }
    function done() { spots.forEach(function (x) { x.remove(); }); try { localStorage.setItem("fg-motion-hint", "1"); } catch (e) {} }
    spots.forEach(function (sp) {
      sp.querySelector("[data-mo-reduce]").addEventListener("click", function () { if (MODE === "full" && ctl) ctl.click(); else setMode("reduced"); done(); });
      sp.querySelector("[data-mo-dismiss]").addEventListener("click", done);
    });
  })();

  /* ---------- contact popover ---------- */
  var cbtn = $("contact-btn"), pop = $("contact-pop");
  /* the list unfolds from the Contact pill (reason: it is that button opening, not a box appearing) */
  function openPop() {
    pop.hidden = false; cbtn.setAttribute("aria-expanded", "true");
    if (!still() && pop.animate) pop.animate([{ opacity: 0, transform: "scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: EOUT });
    var f = pop.querySelector("a"); if (f) f.focus();
  }
  function closePop(ret) { if (pop.hidden) return; pop.hidden = true; cbtn.setAttribute("aria-expanded", "false"); if (ret) cbtn.focus(); }
  cbtn.addEventListener("click", function () { if (pop.hidden) openPop(); else closePop(); });
  document.addEventListener("click", function (e) { if (!pop.hidden && !e.target.closest(".cwrap")) closePop(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) closePop(true); });
  pop.addEventListener("focusout", function (e) { if (e.relatedTarget && !pop.parentNode.contains(e.relatedTarget)) closePop(); });

  /* ---------- guided tour: main-page stops only, with "Open this project" at each; each step travels with the scroll tween ---------- */
  var tourbox = $("tourbox"), live = $("tour-live");
  function tourGo(i) {
    clearTimeout(tour.timer);
    if (i >= N) {
      scrollToEl($("hello"));
      endTour("Tour finished");
      setTimeout(function () { $("end-t").focus({ preventScroll: true }); }, 50);
      return;
    }
    tour.i = i;
    var s = $("stop-" + P[i].id), arrive = still() ? 150 : 1000;
    scrollToEl(s);
    live.textContent = "Tour · Project " + P[i].no + " / " + TOTAL;
    tour.segStart = performance.now() + arrive;
    tour.timer = setTimeout(function () { tourGo(i + 1); }, arrive + tour.segDur);
    kick();
  }
  function startTour() {
    closePop();
    tour.on = true; body.classList.add("tour-on");
    tourbox.hidden = false;
    /* the tour bar rises from the bottom edge (reason: it arrives from outside the page, and leaves the same way) */
    if (!still() && tourbox.animate) tourbox.animate([{ translate: "0 160%", opacity: 0 }, { translate: "0 0", opacity: 1 }], { duration: 380, easing: EOUT });
    $("tour-next").focus({ preventScroll: true });
    tourGo(0);
  }
  function endTour(msg) {
    if (!tour.on) return;
    tour.on = false; clearTimeout(tour.timer);
    body.classList.remove("tour-on");
    live.textContent = msg || "Tour ended";
    var hadFocus = tourbox.contains(document.activeElement);
    setTimeout(function () {
      if (tour.on) return;
      if (!still() && tourbox.animate) tourbox.animate([{ translate: "0 0", opacity: 1 }, { translate: "0 160%", opacity: 0 }], { duration: 300, easing: "ease-in" }).onfinish = function () { if (!tour.on) tourbox.hidden = true; };
      else tourbox.hidden = true;
    }, 900);
    var sec = sections[curPos], idx = sec && sec.hasAttribute("data-idx") ? +sec.getAttribute("data-idx") : -1;
    if (hadFocus && idx >= 0 && !DT.open) { var h = $("t-" + P[idx].id); if (h) h.focus({ preventScroll: true }); }
  }
  $("tour-start").addEventListener("click", function () { setTimeout(startTour, 0); });
  $("tour-next").addEventListener("click", function () { if (tour.on) tourGo(tour.i + 1); });
  $("tour-end").addEventListener("click", function () { endTour(); });
  $("tour-open").addEventListener("click", function (e) {
    var id = P[tour.i].id;
    openDetail(id, { from: $("open-" + id), point: e.detail ? [e.clientX, e.clientY] : null });
  });
  function interrupt(e) {
    if (!tour.on) return;
    if (e.target && e.target.closest && e.target.closest("#tourbox")) return;
    endTour();
  }
  ["wheel", "touchstart", "pointerdown", "keydown"].forEach(function (ev) { window.addEventListener(ev, interrupt, { passive: true, capture: true }); });

  measure();
  /* honour an incoming #id: a project link opens its detail page without the expand */
  if (location.hash && location.hash.length > 1) {
    var pm = /^#project\/(.+)$/.exec(location.hash);
    if (pm && $("d-" + decodeURIComponent(pm[1]))) openDetail(decodeURIComponent(pm[1]), { animate: false, push: false });
    else {
      var target = document.getElementById(location.hash.slice(1));
      if (target) setTimeout(function () { target.scrollIntoView({ block: "start" }); }, 0);
    }
  }
})();
</script>
</body>
