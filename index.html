/* =====================================================================
   COLOUR TOKENS: the only two blocks in this file with colour literals.
   The first block applies in both themes (it matches :root); the second overrides for dark.
   Two kinds of place:
   - MAIN PAGES: neutral base-* surface, cards, and a small sunset accent
     (--accent-gradient on primary buttons, --underline-gradient on the hero underline
     and the selected / next route). --amb-* tint the screen edges per section as you scroll.
   - DETAIL PAGES: detail-* (the full sunset slab, same in both themes).
   Contrast (WCAG): light ink on base 14.6:1, accent on base 7.5:1; cream on button gradient 5.2:1 or more.
   Dark: cream on base 16.0:1, dark accent on base 5.8:1. Detail: cream on the mid stop 6.5:1 (text kept
   off the bright corner; long text sits on the cream card, ink on cream 15.7:1).
   Expanded page, measured pairs:
     light  ink on the paper card 15.7:1 | deep red link on the card 8.0:1 | ink on the card's glow peak 14.1:1
     dark   cream on the dark glass card 15.2:1 | light red link #ff9d8f on the card 8.4:1
            cream on glass over the bright corner 13.7:1 | cream on glass plus glow peak 9.2:1
            link #ff9d8f on the glow peak about 5.8:1 (the old #f0786a was 4.0:1 there)
   BASES: white (light) and a warm near-black #0b0808 (dark); ink #1f1512 on white 17.4:1, cream #f1e9dc on #0b0808 16.1:1,
   light accent #86251c on white 9.0:1, dark accent #e0685c on #0b0808 5.9:1. Colour arrives as light (--ce-g*) on top.
   WHOLE-SCREEN TONES (--tone-*): the fixed colour layer behind everything takes one of these per section
   (named by the 4th field of each section's data-amb preset). Small steps only: chapter two is redder,
   the back matter cooler. Body text on every tone: dark cream 15:1 or more, light ink 14:1 or more;
   accent text 5.2:1 or more (dark) and 6.9:1 or more (light).
   ===================================================================== */
:root,:root[data-theme="light"]{
  color-scheme:light;
  --base-bg:#ffffff; --base-ink:#1f1512; --base-muted:#1f1512; --base-line:rgba(31,21,18,.14); --base-hover:rgba(31,21,18,.05); --base-chrome:rgba(255,255,255,.82);
  --tone-hero:#ffffff; --tone-map:#fdfcfc; --tone-ch1:#fffdfb; --tone-h0:#fffcfa; --tone-h1:#fefbf9; --tone-h2:#fffdfc; --tone-h3:#fefaf8;
  --tone-ch2:#fffaf8; --tone-o0:#fff9f7; --tone-o1:#fff8f5; --tone-o2:#fffaf8; --tone-o3:#fff9f6; --tone-back:#fcfcfd; --tone-ai:#fbfbfc; --tone-end:#fcfbfb;
  /* blended by the colour engine (these are the no-JS / first-paint values): screen gradient stops and the top bar */
  --ce-1:#ffffff;
  --bar-bg:rgba(255,255,255,.86); --bar-ink:#1f1512; --bar-line:rgba(31,21,18,.16); --bar-btn:#941819; --bar-btn-ink:#f6efe4; --bar-acc:#86251c;
  /* the two divider lines while a project is expanded (over the sunset) */
  --ln-open:rgba(246,239,228,.42);
  --card-bg:#ffffff; --card-ink:#1f1512; --card-line:rgba(31,21,18,.16);
  /* text boxes: one ember-glow set for every card that holds text (glow rises from the bottom edge) */
  --card-glow:rgba(184,40,24,.17); --card-glow-2:rgba(184,40,24,.06); --card-glow-size:60% 120px; --card-line-warm:rgba(196,52,31,.22);
  --card-shadow:0 18px 40px -24px rgba(184,40,24,.3); --card-blur:none;
  --accent:#86251c; --accent-ink:#f6efe4;
  --sun-1:#8f1f18; --sun-2:#b8321f;
  --accent-gradient:linear-gradient(120deg,var(--sun-1),var(--sun-2));
  --btn-bg:var(--accent-gradient,var(--accent)); --btn-ink:#f6efe4;
  --route-1:#8f1f18; --route-2:#c4341f;
  --underline-gradient:linear-gradient(90deg,var(--route-1),var(--route-2));
  /* ambient glows: hues along the sunset family (deep red, red-orange, warm amber, rose-brown); --amb-max is the peak */
  --amb-0:#b3261e; --amb-1:#e0502a; --amb-2:#f0a050; --amb-3:#b0685e; --amb-max:.11;
  --topo-detail:#f6efe4; --topo-do:.13;
  --plate-bg:linear-gradient(160deg,#360b0b,#7d1c17); --plate-line:rgba(31,21,18,.16);
  --photo-line:rgba(31,21,18,.16); --photo-filter:sepia(.08) saturate(1.05) contrast(1.02);
  --skip-bg:#1f1512; --skip-ink:#ffffff;
  --shadow:rgba(31,16,12,.42); --shadow-soft:rgba(31,16,12,.22);
  --topo-o:.1;
  /* detail pages: identical in both themes */
  --detail-bg:linear-gradient(160deg,#360b0b 0%,#6a1513 32%,#a3241d 62%,#ee4f2a 100%);
  --detail-solid:#4e110e; --detail-bar:rgba(54,11,11,.92);
  --detail-ink:#f6efe4; --detail-onbg:#e9c69b; --detail-line:rgba(246,239,228,.3); --detail-btn-bg:#f6efe4; --detail-btn-ink:#1f1512;
  --detail-card-bg:#ffffff; --detail-card-solid:#ffffff; --detail-card-ink:#1f1512; --detail-card-line:rgba(31,21,18,.16); --detail-card-hover:rgba(31,21,18,.05); --detail-link:#86251c; --detail-link-ink:#f6efe4;
  --detail-sheet-btn:#86251c; --detail-sheet-btn-ink:#f6efe4; --c-code-bg:#f4f1ee;
  --detail-plate-bg:rgba(20,12,10,.35); --detail-plate-line:rgba(246,239,228,.3);
  --detail-route-1:#8f1f18; --detail-route-2:#c4341f;
  --detail-shadow:rgba(20,6,4,.45);
  /* the live sketch: ink on paper in both themes (it is a sketch); its accent is the detail-route red */
  --s4-hit:rgba(0,0,0,.001);
  --sketch-paper:#ffffff; --sketch-ink:#1f1512; --sketch-label:#3a2a24; --sketch-note:#fdfbf9; --sketch-photo-bg:#ece7e2;
  /* case-study content inside expanded pages */
  --c-mat:#f4f1ee; --lbox-bg:rgba(20,8,6,.94);
  --svg-bg:#4a120e; --svg-surface:#5c1712; --svg-ink:#f6efe4; --svg-ink-soft:rgba(246,239,228,.72); --svg-line:rgba(246,239,228,.28); --svg-accent:#ffd9a0; --svg-accent-soft:rgba(255,217,160,.22);
  --sketch-line:rgba(31,21,18,.22); --sketch-rule:rgba(31,21,18,.14); --sketch-shadow:rgba(31,21,18,.55); --sketch-shadow-2:rgba(31,21,18,.18);
  /* theme switch (same in both themes): the knob's sun colour, and the light wash the page gets during the light-mode joke */
  --tt-sun:#f0a050; --peek:#ffffff;
  /* coloured light on the plain base (written by the colour engine): bottom-right core, left bounce, faint top wash.
     Strengths: --exp-* while a project is expanded, --main-* on the main page; --exp-intensity scales the --exp-* set. */
  --ce-g1:rgba(239,129,97,0);
  --ce-g2:rgba(239,129,97,0);
  --ce-g3:rgba(239,129,97,0);
  --exp-glow-1:.36;
  --exp-glow-2:.24;
  --exp-fill:.1;
  --main-glow-1:.24;
  --main-glow-2:.15;
  --main-fill:.07;
  --hv-sheen:rgba(255,255,255,.24);
  /* the plate spotlight: peak and fill strength of the accent light behind drawings */
  --spot-a:24%; --spot-f:8%;
  --exp-intensity:1; --exp-card-glow:.18;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --base-bg:#0b0808; --base-ink:#f1e9dc; --base-muted:#f1e9dc; --base-line:rgba(241,233,220,.14); --base-hover:rgba(241,233,220,.06); --base-chrome:rgba(11,8,8,.8);
  --tone-hero:#0b0808; --tone-map:#0b080a; --tone-ch1:#0d0808; --tone-h0:#0e0808; --tone-h1:#0f0909; --tone-h2:#0e0909; --tone-h3:#0d0908;
  --tone-ch2:#120808; --tone-o0:#140808; --tone-o1:#150807; --tone-o2:#130909; --tone-o3:#140908; --tone-back:#0a090a; --tone-ai:#09090b; --tone-end:#0b090a;
  --ce-1:#0b0808;
  --bar-bg:rgba(11,8,8,.86); --bar-ink:#f1e9dc; --bar-line:rgba(241,233,220,.14); --bar-btn:#973314; --bar-btn-ink:#f1e9dc; --bar-acc:#e0685c;
  --ln-open:rgba(241,233,220,.3);
  --card-bg:#141010; --card-ink:#f1e9dc; --card-line:rgba(241,233,220,.14);
  --card-glow:rgba(194,40,26,.24); --card-glow-2:rgba(238,79,42,.1); --card-line-warm:rgba(238,79,42,.3);
  --card-shadow:0 18px 44px -26px rgba(194,40,26,.45); --card-blur:blur(10px);
  /* the expanded page, dark version: a deeper sunset, warm dark glass cards, the light accent red */
  --detail-bg:linear-gradient(160deg,#1c0606 0%,#3e0d0b 32%,#6f1712 62%,#c23a20 100%);
  --detail-solid:#2a0909; --detail-bar:rgba(28,6,6,.92);
  --detail-ink:#f1e9dc; --detail-onbg:#e9c69b; --detail-line:rgba(241,233,220,.14); --detail-btn-bg:var(--accent-gradient); --detail-btn-ink:#f1e9dc;
  --detail-card-bg:rgba(18,12,12,.8); --detail-card-solid:#141010; --detail-card-ink:#f1e9dc; --detail-card-line:rgba(241,233,220,.14); --detail-card-hover:rgba(241,233,220,.06);
  --detail-link:#ff9d8f; --detail-link-ink:#0b0808; --detail-sheet-btn:var(--accent-gradient); --detail-sheet-btn-ink:#f1e9dc;
  --detail-plate-line:rgba(241,233,220,.14); --detail-route-1:#e0685c; --detail-route-2:#f0786a; --detail-shadow:rgba(0,0,0,.6);
  --c-mat:#0b0808; --c-code-bg:#0b0808; --lbox-bg:rgba(8,4,3,.95);
  --sketch-paper:#141010; --sketch-ink:#f1e9dc; --sketch-label:#e6d9c7; --sketch-note:#1b1515; --sketch-photo-bg:#221a1a;
  --sketch-line:rgba(241,233,220,.14); --sketch-rule:rgba(241,233,220,.1); --sketch-shadow:rgba(0,0,0,.6); --sketch-shadow-2:rgba(0,0,0,.4);
  --accent:#e0685c; --accent-ink:#0b0808;
  --btn-ink:#f1e9dc;
  --route-1:#d8452a; --route-2:#f08a5a;
  --amb-0:#a3241d; --amb-1:#e0502a; --amb-2:#e89040; --amb-3:#9a5a50; --amb-max:.2;
  --plate-line:rgba(241,233,220,.14);
  --photo-line:rgba(241,233,220,.14);
  --skip-bg:#f1e9dc; --skip-ink:#0b0808;
  --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.35);
  --topo-o:.09;
  --ce-g1:rgba(172,60,24,0);
  --ce-g2:rgba(172,60,24,0);
  --ce-g3:rgba(172,60,24,0);
  --exp-glow-1:.36;
  --exp-glow-2:.24;
  --exp-fill:.1;
  --main-glow-1:.16;
  --main-glow-2:.1;
  --main-fill:.04;
  --hv-sheen:rgba(255,255,255,.14);
  --spot-a:28%; --spot-f:9%; --plate-glass:rgba(255,255,255,.07);
  --exp-intensity:1;
}
/* ===================== end of colour tokens ===================== */

/* surface context: components read only these names */
body{--fg:var(--base-ink);--muted:var(--base-muted);--rule:var(--base-line);--hover:var(--base-hover);--link:var(--accent);--link-ink:var(--accent-ink);--focus:var(--accent);--btn:var(--btn-bg);--btn-fg:var(--btn-ink);--solid:var(--base-bg);--chrome:var(--base-chrome);--card:var(--card-bg);--card-fg:var(--card-ink);--card-rule:var(--card-line);--card-link:var(--accent);--plate-c:var(--plate-bg);--plate-l:var(--plate-line);--route:url(#sun-route)}
/* cards: one small readable surface */
.card,.mpanel,.elabel,.secnote,.nl,.pop,.tourbox,.ctr-box,.cue,.c-call,.c-card,.c-embed,.d-idx,.lbox p,.b-block,.ai-box,.foot,.theme-joke{--fg:var(--card-fg);--muted:var(--card-fg);--rule:var(--card-rule);--link:var(--card-link);--focus:var(--card-link);--solid:var(--card);background:var(--card);color:var(--fg)}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--ce-1);-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:transparent;color:var(--fg);font-family:var(--sans);font-size:1.0625rem;font-weight:500;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.d-lock,.d-lock body{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.skip{position:fixed;left:var(--corner);top:-80px;z-index:90;background:var(--skip-bg);color:var(--skip-ink);padding:.7rem 1rem;border-radius:999px;font-weight:600;text-decoration:none}
.skip:focus{top:var(--corner)}
.ico{width:1em;height:1em;flex:none}
svg path{stroke-linecap:round;stroke-linejoin:round}
.ico path,.ico circle{fill:none;stroke:currentColor;stroke-width:2}
.lbl{font:600 .75rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in-wrap{width:100%;max-width:var(--max);margin:0 auto}
[data-section],.chapter{scroll-margin-top:calc(var(--bar) + var(--sat,0px))}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* contour lines: the printed paper of a map; static */
.topo{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;color:var(--base-ink);opacity:var(--topo-o);transition:color .6s ease,opacity .6s ease}
/* whole-screen colour (reason: the screen itself tells you that you have moved on).
   Two stacked tone layers cross-fade by opacity when the section at the viewport centre changes;
   the sunset layer on top fades in while a project expands, in step with the divider lines. */
.scr{position:fixed;inset:0;z-index:0;pointer-events:none}
/* light falling on a plain surface: a large soft core at the bottom-right corner, a fainter bounce on the left,
   a faint wash from the top; each has a bright centre and a long falloff. Only these colours change. */
.scr i{position:absolute;inset:0;background:
  radial-gradient(circle max(88vmin,340px) at 100% 100%,var(--ce-g1),color-mix(in srgb,var(--ce-g1) 58%,transparent) 30%,color-mix(in srgb,var(--ce-g1) 20%,transparent) 64%,transparent 100%),
  radial-gradient(circle max(66vmin,260px) at 0% 46%,var(--ce-g2),color-mix(in srgb,var(--ce-g2) 42%,transparent) 36%,transparent 100%),
  radial-gradient(120vw max(34vh,220px) at 50% 0%,var(--ce-g3),transparent 100%),
  var(--ce-1)}
.topo path{fill:none;stroke:currentColor;stroke-width:1.1;vector-effect:non-scaling-stroke}
/* contour lines: two layers of calm, evenly spaced flowing lines (alternate lines in each), a little larger than the
   screen; in Full motion each layer drifts very slowly in its own direction (transform only, so the compositor moves
   it), which reads as the map gently breathing. Reduced and Off: still. */
.topo-l{position:absolute;left:-3%;top:-3%;width:106%;height:106%}
html.mo-on:not(.mo-lite) .topo-l1{will-change:transform;animation:topo-d1 56s ease-in-out infinite alternate}
html.mo-on:not(.mo-lite) .topo-l2{will-change:transform;animation:topo-d2 71s ease-in-out infinite alternate}
@keyframes topo-d1{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(-16px,10px,0) rotate(.12deg)}100%{transform:translate3d(9px,-14px,0)}}
@keyframes topo-d2{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-9px,0) rotate(-.1deg)}100%{transform:translate3d(-11px,16px,0)}}
main{position:relative;z-index:2;overflow-x:hidden;overflow-x:clip}

/* ember glow, low on each chapter and on the map, alternating sides by chapter.
   reason: carries the detail-page colour through the main pages as a hint. Static, faint. */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--amb-max)}
.amb i{position:absolute;width:84vmax;height:84vmax;border-radius:50%;opacity:0;will-change:opacity}
.amb .p-l{left:-42vmax;top:calc(68% - 42vmax)}
.amb .p-r{right:-42vmax;top:calc(36% - 42vmax)}
.amb .p-b{left:calc(50% - 42vmax);bottom:-62vmax}
.amb .h0{background:radial-gradient(closest-side,var(--amb-0),transparent)}
.amb .h1{background:radial-gradient(closest-side,var(--amb-1),transparent)}
.amb .h2{background:radial-gradient(closest-side,var(--amb-2),transparent)}
.amb .h3{background:radial-gradient(closest-side,var(--amb-3),transparent)}
/* reduced motion: presets switch at section boundaries with a short fade instead of following the scroll */
.amb.rm i{transition:opacity .3s linear}

/* ---------- image frames: one treatment everywhere ----------
   photos stay true (reason: they are evidence): hairline border, very light warm grade, no overlay.
   diagrams sit on the plate so their cream strokes always read. */
.frame{position:relative;overflow:hidden;border-radius:6px;background:var(--plate-c)}
.frame.cover{border:1px solid var(--photo-line)}
.frame.cover img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter)}
.frame.contain{border:1px solid var(--plate-l)}
.frame.contain img{width:100%;height:100%;object-fit:contain}
/* cut-outs (photo with the background removed, the owner's choice for the boat): shown whole and
   uncropped, floating on the surface. No plate, frame, border, box shadow or grade; only a soft
   drop shadow that follows the object itself. */
.frame.cutout{background:none;border:0;border-radius:0;overflow:visible}
/* bare photo compositions: they fade into the page at their edges, so no plate, frame, mat or shadow; fitted whole
   (they carry labels); a soft mask on the outer 6% so no rectangle edge can show against the screen's light */
.frame.bare{background:var(--img-veil);border:0;border-radius:0;overflow:visible;box-shadow:none}
.frame.bare img{width:100%;height:100%;object-fit:contain;filter:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent),linear-gradient(180deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent),linear-gradient(180deg,transparent,var(--base-ink) 8%,var(--base-ink) 92%,transparent);mask-composite:intersect}
.fig.bare,.d-fig.bare,.mp-fig.bare{aspect-ratio:16/10;box-shadow:none;max-height:none}
.card-p.frame.bare{border-bottom:1px solid var(--rule)}
/* a stop with a photo composition gives the picture about 58% of the row */
@media (min-width:768px){
  .sgrid.wide .s-text{grid-column:1/span 5}.sgrid.wide .s-media{grid-column:6/span 7}
  .sgrid.rev.wide .s-text{grid-column:8/span 5}.sgrid.rev.wide .s-media{grid-column:1/span 7}
}
/* and in the expanded view it runs wide beside the title */
@media (min-width:1024px){.d-top.wide{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
/* hover: no tilt box on hero images; a gentle grow, and the drawings' highlights brighten */
:is(.hv-fig,.hv-plate).hv.timg :is(img,svg.dg){scale:1.015}
.hv-fig.hv.timg{transform:none}
:is(.hv-fig,.hv-plate).hv svg.hiso{filter:brightness(1.12) saturate(1.15)}
.frame.cutout img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 14px var(--shadow-soft))}
.dlayer .frame.cutout img{filter:drop-shadow(0 18px 18px var(--detail-shadow))}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- heading reveal ----------
   reason: marks arriving at a new place. Headings only, lines rise from behind a clip, once.
   Hidden state exists only after JS adds .lr-arm, so content is visible without JS. */
.lr-arm{opacity:0}

.lr-i{display:block}
.lr-go .lr-i{animation:lr-rise 500ms var(--ease-out) both;animation-delay:calc(var(--d,0ms) + var(--i,0) * 60ms)}
@keyframes lr-rise{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
/* subtitle fade: reason: the project line follows its title, as one arrival */
.lf-arm{opacity:0}
.lf-go{animation:lf-in 300ms ease-out both;animation-delay:var(--ld,250ms)}
@keyframes lf-in{from{opacity:0}to{opacity:1}}

/* ---------- chrome (always neutral, so it never changes colour while you scroll) ---------- */
.c{position:fixed;z-index:50}
/* the top bar takes the screen's colour too: its backing, hairline, text, switch and Contact pill all read the
   blended --bar-* values the colour engine writes, so no band at the top stays the old colour.
   Safe areas: the bar grows under a phone's status area (viewport-fit=cover) and its items keep clear of it. */
:root{--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
#chrome{--fg:var(--bar-ink);--muted:var(--bar-ink);--rule:var(--bar-line);--btn:var(--bar-btn);--btn-fg:var(--bar-btn-ink);--accent:var(--bar-acc);--focus:var(--bar-acc);color:var(--bar-ink)}
.topbar{position:fixed;left:0;right:0;top:0;height:calc(var(--bar) + var(--sat));z-index:49;background:var(--bar-bg);border-bottom:1px solid var(--bar-line);pointer-events:none}
@supports (backdrop-filter:blur(8px)) or (-webkit-backdrop-filter:blur(8px)){.topbar{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
.c-tl{top:calc((var(--bar) - 40px) / 2 + var(--sat));left:calc(var(--gut) + var(--sal));height:40px;display:flex;align-items:center}
.c-tr{top:calc((var(--bar) - 40px) / 2 + var(--sat));right:calc(var(--gut) + var(--sar));height:40px;display:flex;align-items:center;gap:clamp(.6rem,1.6vw,1.2rem)}
/* counter fades in: reason: it only means something once you are inside the stops */
.c-bl{bottom:var(--corner);left:var(--corner);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.in-stop .c-bl{opacity:1;visibility:visible;transition:opacity .3s}
.ctr-mini{display:none;font:600 .8rem/1 var(--mono);letter-spacing:.04em}
.c-br{bottom:var(--corner);right:var(--corner)}
/* the cover mark: reason: it is the site's title on every page */
.mark{display:flex;align-items:center;gap:.7rem;text-decoration:none;padding:.15rem .1rem}
.mk-n{display:flex;flex-direction:column;line-height:.92}
.mk-1{font:italic 400 1.35rem/1 var(--serif);letter-spacing:0}
.mk-2{font:800 .9rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
/* the one addition to the bar while a project is expanded: a way back (reason: convenience, not a new page) */
.bchip{display:inline-flex;align-items:center;gap:.35rem;height:36px;margin-left:clamp(.6rem,1.4vw,1rem);padding:0 .85rem 0 .6rem;border-radius:999px;border:1px solid var(--rule);background:transparent;cursor:pointer;font-weight:600;font-size:.9rem;transition:scale 90ms ease,border-color .2s}
.bchip[hidden]{display:none}
.bchip:hover{border-color:var(--bar-acc)}
.bchip .ico{transition:transform .25s var(--ease)}
.bchip:hover .ico{transform:translateX(-3px)}
/* the narrowest phones: the chip keeps its arrow and says "Back" to screen readers, so the bar never overflows */
@media (max-width:419px){.bchip{padding:0 .7rem}.bchip-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
.toplink{font-weight:600;font-size:.95rem;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.25em}
.toplink:hover{text-decoration-color:currentColor}
/* theme control as a sliding switch, ported from the live site: knob on the right means dark */
.theme{height:40px;border-radius:999px;border:1px solid var(--rule);background:transparent;display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;padding:0 .7rem 0 .35rem;font-weight:600;font-size:.9rem}
.theme:hover{border-color:currentColor}
.tt-track{position:relative;display:inline-block;width:2.6rem;height:1.4rem;border-radius:999px;background:color-mix(in srgb,var(--fg) 16%,transparent);border:1px solid var(--rule);transition:background-color .3s ease}
.tt-knob{position:absolute;top:50%;left:.14rem;width:1.05rem;height:1.05rem;margin-top:-.525rem;border-radius:50%;background:var(--tt-sun);box-shadow:0 0 0 2px color-mix(in srgb,var(--tt-sun) 30%,transparent);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background-color .3s ease,box-shadow .3s ease}
.theme[data-mode="dark"] .tt-track{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:var(--accent)}
.theme[data-mode="dark"] .tt-knob{transform:translateX(1.2rem);background:var(--fg);box-shadow:inset -.3rem -.12rem 0 0 color-mix(in srgb,var(--accent) 40%,var(--base-bg))}
