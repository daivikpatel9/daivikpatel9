  <title>One wall remote, other brands' lights</title>
  <desc>A button press on a wall remote reaches Home Assistant over a local wireless network, with no internet needed. Its buttons switch a room light and a smart plug and dim a light strip from another brand. A long press brings back a scene.</desc>
