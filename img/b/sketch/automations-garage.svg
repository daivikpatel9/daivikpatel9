<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>The garage that closes itself</title>
  <desc>A garage door is left open and a 15 minute timer starts. Movement in the garage starts the timer over. When nobody is there and the timer ends, the door closes itself, while the opener's own safety beam still guards the doorway. Phones get a message and the tablet chimes.</desc>
