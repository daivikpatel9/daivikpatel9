<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>How I reach home with no open ports</title>
  <desc>A house with every door closed. The home server opens a tunnel outward to a relay on a cloud server. A visitor elsewhere opens an address, the relay's proxy passes the request down the tunnel, and the service at home answers back the same way. A separate private path, Tailscale, serves my own devices.</desc>
