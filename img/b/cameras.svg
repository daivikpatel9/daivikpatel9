<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 103 1154 478" role="img" aria-label="Diagram: a camera feeds a bridge, then a recorder that detects people, cars and packages on local hardware and alerts phones, the TV and the dashboard" font-family="Archivo, Helvetica, Arial, sans-serif"><title>Diagram: a camera feeds a bridge, then a recorder that detects people, cars and packages on local hardware and alerts phones, the TV and the dashboard</title><defs><marker id="a-5fd0c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f6efe4" /></marker><marker id="a-f2b866" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffd9a0" /></marker><marker id="a-9fc4be" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f6efe4" fill-opacity="0.8" /></marker></defs><rect x="40" y="250" width="200" height="110" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="140.0" y="314.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Camera</text><line x1="240" y1="305" x2="290" y2="305" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><rect x="290" y="250" width="200" height="110" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="390.0" y="304.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Bridge</text><text x="390.0" y="330.1" font-size="19" font-weight="500" fill="#f6efe4" text-anchor="middle" fill-opacity="0.8">steadies the stream</text><line x1="490" y1="305" x2="540" y2="305" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><rect x="540" y="250" width="270" height="110" rx="14" fill="#f6efe4" stroke="#f6efe4" stroke-width="2" /><text x="675.0" y="304.1" font-size="26" font-weight="650" fill="#1f1512" text-anchor="middle">Recorder</text><text x="675.0" y="330.1" font-size="19" font-weight="500" fill="#1f1512" text-anchor="middle">detects on local hardware</text><rect x="535" y="395" width="88" height="40" rx="20" fill="none" stroke="#ffd9a0" stroke-width="2" /><text x="579" y="422" font-size="18" font-weight="600" fill="#ffd9a0" text-anchor="middle">person</text><rect x="631" y="395" width="88" height="40" rx="20" fill="none" stroke="#ffd9a0" stroke-width="2" /><text x="675" y="422" font-size="18" font-weight="600" fill="#ffd9a0" text-anchor="middle">car</text><rect x="727" y="395" width="88" height="40" rx="20" fill="none" stroke="#ffd9a0" stroke-width="2" /><text x="771" y="422" font-size="18" font-weight="600" fill="#ffd9a0" text-anchor="middle">package</text><rect x="920" y="120" width="240" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="1040.0" y="174.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Phones</text><line x1="810" y1="305" x2="920" y2="165" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><rect x="920" y="270" width="240" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="1040.0" y="324.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">TV</text><line x1="810" y1="305" x2="920" y2="315" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><rect x="920" y="420" width="240" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="1040.0" y="474.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Dashboard</text><line x1="810" y1="305" x2="920" y2="465" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><text x="600" y="560" font-size="22" font-weight="500" fill="#f6efe4" text-anchor="middle" fill-opacity="0.8">Alerts leave the recorder only when the right thing crosses the right zone</t