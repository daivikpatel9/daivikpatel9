<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" class="hiso hiso-remote" aria-labelledby="remote-t remote-d" font-family="Archivo, Helvetica, Arial, sans-serif"><title id="remote-t">Remote access: the home dials out, nothing opens in</title><desc id="remote-d">Two isometric plates side by side. On the left, a visitor's laptop connects to a cloud relay tower. On the right, a cut-away house with its door shut and the home server inside. A single tube of light starts at the server inside the house and travels out to the relay, its arrowheads pointing away from the house. The house is tagged zero ports open at home, and a dotted private line labelled Tailscale reaches a phone.</desc><style>.hiso .fa{fill:var(--plate-ink, #f6efe4);fill-opacity:.07}.hiso .fb{fill:var(--plate-fill, rgba(20,12,10,0.28));fill-opacity:.85}.hiso .fc{fill:var(--plate-fill, rgba(20,12,10,0.28));fill-opacity:.4}.hiso .fk{fill:var(--plate-ink, #f6efe4)}.hiso .fl{stroke:var(--plate-highlight, #ffd9a0);stroke-width:3;stroke-dasharray:1.5 24;stroke-linecap:round;fill:none}.hiso .fo{fill:var(--plate, transparent)}.hiso .fy{fill:var(--plate-highlight, #ffd9a0);fill-opacity:.92}.hiso .fyt{fill:var(--plate-highlight, #ffd9a0);fill-opacity:.14}.hiso .k{stroke:var(--plate-ink, #f6efe4);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.hiso .k2{stroke:var(--plate-ink, #f6efe4);stroke-width:1.05;stroke-opacity:.6;stroke-linejoin:round;stroke-linecap:round}.hiso .kd{stroke:var(--plate-ink, #f6efe4);stroke-width:1.1;stroke-opacity:.6;stroke-dasharray:2 5;stroke-linecap:round}.hiso .n{fill:none}.hiso .tx{fill:var(--plate-ink, #f6efe4);font-size:15px;font-weight:600;letter-spacing:.14em}.hiso .ty{fill:var(--plate-highlight, #ffd9a0);font-size:14px;font-weight:700;letter-spacing:.12em}.hiso .y{stroke:var(--plate-highlight, #ffd9a0);stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}.hiso .yd{stroke:var(--plate-highlight, #ffd9a0);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round}.hiso .yw{stroke:var(--plate-highlight, #ffd9a0);stroke-width:10;stroke-opacity:.16;stroke-linecap:round;stroke-linejoin:round}@media (prefers-reduced-motion:no-preference){.hiso.live .fl{animation:ibflow 6s linear infinite}.hiso.live .ib-breath{animation:ibbreath 5s ease-in-out infinite}.hiso.live .ib-ring{animation:ibring 8s linear infinite}.hiso.live .ib-bob{animation:ibbob 6s ease-in-out infinite}.hiso.live .ib-blink{animation:ibblink 4s ease-in-out infinite}}@keyframes ibflow{to{stroke-dashoffset:-51}}@keyframes ibbreath{50%{opacity:.5}}@keyframes ibring{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}@keyframes ibbob{50%{transform:translateY(-5px)}}@keyframes ibblink{50%{opacity:.35}}</style><defs><radialGradient id="remote-grid" gradientUnits="userSpaceOnUse" cx="400" cy="292" r="360.7" gradientTransform="translate(400 292) scale(1 .577) translate(-400 -292)"><stop offset="0" style="stop-color:var(--plate-ink, #f6efe4)" stop-opacity="0.2"/><stop offset=".6" style="stop-color:var(--plate-ink, #f6efe4)" stop-opacity="0.08"/><stop offset="1" style="stop-color:var(--plate-ink, #f6efe4)" stop-opacity="0"/></radialGradient><radialGradient id="remote-rpool"><stop offset="0" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.22"/><stop offset=".55" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.077"/><stop offset="1" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0"/></radialGradient><linearGradient id="remote-lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity=".34"/><stop offset="1" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity=".06"/></linearGradient><radialGradient id="remote-hpool"><stop offset="0" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.2"/><stop offset=".55" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.07"/><stop offset="1" style="stop-color:var(--plate-highli