<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" class="hiso hiso-cameras" aria-labelledby="cameras-t cameras-d" font-family="Archivo, Helvetica, Arial, sans-serif"><title id="cameras-t">Cameras and AI: a person is spotted at the door, at home</title><desc id="cameras-d">Isometric doorstep. A doorbell camera projects a soft view cone onto the path, where a faceless walking figure is outlined by a detection frame tagged person. Behind the wall, the home server's small accelerator chip glows to show the detection runs locally, and an alert card lifts off toward a phone.</desc><style>.hiso .fa{fill:var(--plate-ink, #f6efe4);fill-opacity:.07}.hiso .fb{fill:var(--plate-fill, rgba(20,12,10,0.28));fill-opacity:.85}.hiso .fc{fill:var(--plate-fill, rgba(20,12,10,0.28));fill-opacity:.4}.hiso .fk{fill:var(--plate-ink, #f6efe4)}.hiso .fks{fill:var(--plate-ink, #f6efe4);fill-opacity:.35}.hiso .fl{stroke:var(--plate-highlight, #ffd9a0);stroke-width:2.2;stroke-dasharray:1.5 24;stroke-linecap:round;fill:none}.hiso .fo{fill:var(--plate, transparent)}.hiso .fy{fill:var(--plate-highlight, #ffd9a0);fill-opacity:.92}.hiso .fyt{fill:var(--plate-highlight, #ffd9a0);fill-opacity:.14}.hiso .k{stroke:var(--plate-ink, #f6efe4);stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round}.hiso .k2{stroke:var(--plate-ink, #f6efe4);stroke-width:.75;stroke-opacity:.55;stroke-linejoin:round;stroke-linecap:round}.hiso .n{fill:none}.hiso .ts{fill:var(--plate-ink, #f6efe4);fill-opacity:.7;font-size:10.5px;font-weight:500;letter-spacing:.14em}.hiso .tx{fill:var(--plate-ink, #f6efe4);font-size:12.5px;font-weight:600;letter-spacing:.16em}.hiso .ty{fill:var(--plate-highlight, #ffd9a0);font-size:12.5px;font-weight:700;letter-spacing:.16em}.hiso .y{stroke:var(--plate-highlight, #ffd9a0);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.hiso .yd{stroke:var(--plate-highlight, #ffd9a0);stroke-width:1.2;stroke-dasharray:1 5;stroke-linecap:round}@media (prefers-reduced-motion:no-preference){.hiso.live .fl{animation:ibflow 6s linear infinite}.hiso.live .ib-breath{animation:ibbreath 5s ease-in-out infinite}.hiso.live .ib-ring{animation:ibring 8s linear infinite}.hiso.live .ib-bob{animation:ibbob 6s ease-in-out infinite}.hiso.live .ib-blink{animation:ibblink 4s ease-in-out infinite}}@keyframes ibflow{to{stroke-dashoffset:-51}}@keyframes ibbreath{50%{opacity:.5}}@keyframes ibring{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}@keyframes ibbob{50%{transform:translateY(-5px)}}@keyframes ibblink{50%{opacity:.35}}</style><defs><radialGradient id="cameras-grid" gradientUnits="userSpaceOnUse" cx="396.1" cy="318.2" r="306.2" gradientTransform="translate(396.1 318.2) scale(1 .577) translate(-396.1 -318.2)"><stop offset="0" style="stop-color:var(--plate-ink, #f6efe4)" stop-opacity="0.3"/><stop offset=".6" style="stop-color:var(--plate-ink, #f6efe4)" stop-opacity="0.12"/><stop offset="1" style="stop-color:var(--plate-ink, #f6efe4)" stop-opacity="0"/></radialGradient><radialGradient id="cameras-spool"><stop offset="0" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.26"/><stop offset=".55" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.091"/><stop offset="1" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0"/></radialGradient><linearGradient id="cameras-lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity=".34"/><stop offset="1" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity=".06"/></linearGradient><linearGradient id="cameras-beam" gradientUnits="userSpaceOnUse" x1="419.5" y1="272.5" x2="261.9" y2="395.8"><stop offset="0" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.3"/><stop offset="1" style="stop-color:var(--plate-highlight, #ffd9a0)" stop-opacity="0.03"/></linearGradient></defs><path fill="none" stroke="url(#cameras-grid)" stroke-width="0.7" d="M407 124.5L60.5 324.5M428.6 137L82.2 337M450.3 14