<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 133 1174 448" role="img" aria-label="Diagram: a visitor reaches a reverse proxy on a cloud server, which passes traffic to a tunnel server. The home server opens the tunnel outbound, so no ports are open at home" font-family="Archivo, Helvetica, Arial, sans-serif"><title>Diagram: a visitor reaches a reverse proxy on a cloud server, which passes traffic to a tunnel server. The home server opens the tunnel outbound, so no ports are open at home</title><defs><marker id="a-5fd0c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f6efe4" /></marker><marker id="a-f2b866" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffd9a0" /></marker><marker id="a-9fc4be" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f6efe4" fill-opacity="0.8" /></marker></defs><rect x="30" y="285" width="170" height="100" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="115.0" y="344.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Visitor</text><rect x="270" y="150" width="340" height="360" rx="18" fill="none" stroke="#f6efe4" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.8" /><text x="440" y="190" font-size="18" font-weight="700" fill="#f6efe4" text-anchor="middle" fill-opacity="0.8">CLOUD SERVER</text><rect x="300" y="225" width="280" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="440.0" y="279.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Reverse proxy</text><rect x="300" y="375" width="280" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="440.0" y="429.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Tunnel server</text><rect x="760" y="150" width="410" height="360" rx="18" fill="none" stroke="#ffd9a0" stroke-width="2" /><text x="965" y="190" font-size="18" font-weight="700" fill="#ffd9a0" text-anchor="middle">HOME SERVER</text><rect x="790" y="225" width="350" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="965.0" y="279.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Tunnel client</text><rect x="790" y="375" width="350" height="90" rx="14" fill="#140c0a" stroke="#f6efe4" stroke-width="2" fill-opacity="0.28" /><text x="965.0" y="429.1" font-size="26" font-weight="650" fill="#f6efe4" text-anchor="middle">Services</text><line x1="200" y1="320" x2="300" y2="280" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><line x1="440" y1="315" x2="440" y2="375" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><line x1="790" y1="270" x2="580" y2="410" stroke="#ffd9a0" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#a-f2b866)" /><line x1="965" y1="315" x2="965" y2="375" stroke="#f6efe4" stroke-width="2.5" marker-end="url(#a-5fd0c2)" /><text x="690" y="300" font-size="18" font-weight="600" fill="#ffd9a0" text-anchor="middle">outbound</text><text x="690" y="322" font-size="18" font-weight="600" fill="#ffd9a0" text-anchor="middle">tunnel</text><text x="965" y="560" font-size="24" font-weight="700" fill="#ffd9a0" text-anchor="middle">No ports open at home</text><text x="440" y="560" font-size="20" font-weight="500" fill="#f6efe4" text-anchor="middle" fill-opacity="0.8">The only open ports are here</text></svg>